  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
  body{
    background:linear-gradient(135deg,#050814,#0a1a2f);
    display:flex;align-items:center;justify-content:center;
    height:100vh;color:#fff;overflow:hidden;
  }
  #game-wrapper{position:relative;}
  canvas{
    background:radial-gradient(circle at center,#0b1724,#050814);
    border-radius:20px;
    box-shadow:0 15px 50px rgba(0,100,200,0.4),inset 0 0 50px rgba(0,50,100,0.3);
    display:block;
  }
  #top-ui{
    position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:12px;
    font-weight:500;font-size:13px;pointer-events:none;
  }
  #bars{display:flex;flex-direction:column;gap:6px;}
  .bar{position:relative;height:12px;border-radius:8px;background:rgba(255,255,255,0.08);

  .bar-fill{height:100%;border-radius:8px;transition:width 0.2s ease;

            box-shadow:0 0 12px rgba(0,255,136,0.6);}
  #xp-bar .bar-fill{background:linear-gradient(90deg,#ffc400 0%,#ff4d4d 50%,#ff0040 100%);
                    box-shadow:0 0 12px rgba(255,196,0,0.7);}
  .bar-label{font-size:12px;color:rgba(255,255,255,0.9);margin-bottom:2px;font-weight:500;}
  #info{
    background:rgba(10,20,40,0.8);backdrop-filter:blur(12px);
    padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);
    min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .info-line{font-size:12px;margin-bottom:4px;opacity:0.9;}
  .info-value{font-weight:600;color:#00ffcc;}
  .wave-circle{display:inline-block;width:20px;height:20px;background:linear-gradient(45deg,#ff4d4d,#ff8844);
               border-radius:50%;margin-right:6px;box-shadow:0 0 8px rgba(255,77,77,0.6);}
  #message{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    font-size:12px;font-weight:500;opacity:0.85;text-shadow:0 1px 3px rgba(0,0,0,0.8);
    pointer-events:none;background:rgba(0,0,0,0.6);padding:8px 16px;border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);
  }
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
           display:none;align-items:center;justify-content:center;}
  .overlay.show{display:flex;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .panel{
    background:linear-gradient(145deg,#101a2a,#0a1420);
    padding:24px;border-radius:20px;width:340px;max-width:95vw;
    box-shadow:0 20px 40px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.1);
    text-align:center;border:1px solid rgba(255,255,255,0.08);
    transform:scale(0.95);animation:scaleIn 0.3s ease forwards;
  }
  @keyframes scaleIn{to{transform:scale(1);}}
