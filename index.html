*{margin:0;padding:0;box-sizing:border-box;}

/* ─── WAIT OVERLAY ─── */
#waitOverlay{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:60;display:none;align-items:center;justify-content:center;}
#waitOverlay.show{display:flex;}
.wait-box{
  background:linear-gradient(160deg,#080818,#030310);
  border:1.5px solid rgba(255,255,255,.09);
  border-radius:28px;width:min(300px,86vw);
  padding:30px 22px;display:flex;flex-direction:column;
  align-items:center;gap:14px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,40,.9);
}
.wait-icon{font-size:56px;animation:waitPulse 1.2s ease-in-out infinite alternate;}
@keyframes waitPulse{
  0%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(255,200,0,.3));}
  100%{transform:scale(1.1);filter:drop-shadow(0 0 32px rgba(255,200,0,.75));}
}
.wait-title{font-family:'Bangers',cursive;font-size:30px;color:#fff;letter-spacing:3px;}
.wait-sub{font-size:12.5px;color:rgba(255,255,255,.38);line-height:1.6;}
.wait-ring-wrap{position:relative;width:120px;height:120px;}
.wait-ring-svg{width:120px;height:120px;transform:rotate(-90deg);}
.wring-track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:7;}
.wring-fill{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:345;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;}
.wring-fill-common{stroke:#8866ff;}
.wring-fill-rare{stroke:#44aaff;}
.wring-fill-epic{stroke:#cc44ff;}
.wring-fill-legendary{stroke:#ffcc00;}
.wait-time-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Bangers',cursive;font-size:36px;color:#fff;
  letter-spacing:1px;text-shadow:0 0 20px rgba(255,200,0,.45);
}
.wait-progress-label{font-size:10px;color:rgba(255,255,255,.28);letter-spacing:2px;text-transform:uppercase;}
.wait-claim{
  font-family:'Fredoka One',cursive;font-size:17px;
  padding:12px 34px;border:none;border-radius:40px;
  background:linear-gradient(135deg,#44cc66,#228844);color:#fff;
  cursor:pointer;box-shadow:0 6px 22px rgba(0,180,80,.35);
  transition:transform .15s;display:none;
  animation:claimPop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes claimPop{0%{transform:scale(0);}100%{transform:scale(1);}}
.wait-claim:hover{transform:scale(1.06);}
.wait-claim:active{transform:scale(.93);}
.wait-cancel{
  font-family:'Fredoka One',cursive;font-size:12.5px;
  padding:7px 22px;border:none;border-radius:30px;
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.28);
  cursor:pointer;border:1px solid rgba(255,255,255,.08);transition:color .15s;
}
.wait-cancel:hover{color:rgba(255,255,255,.55);}

/* Box open overlay */
#boxOpenOverlay{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:65;display:none;align-items:center;justify-content:center;}
#boxOpenOverlay.show{display:flex;}
.box-open-inner{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:20px;}
.bo-question{font-size:clamp(68px,17vw,105px);animation:boSpin 1s ease-out forwards;}
@keyframes boSpin{0%{transform:rotate(-20deg) scale(0.3);opacity:0;}60%{transform:rotate(10deg) scale(1.2);}100%{transform:rotate(0deg) scale(1);opacity:1;}}
.bo-reveal{font-size:clamp(58px,13vw,92px);display:none;animation:boReveal .6s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes boReveal{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}
.bo-label{font-size:11px;color:rgba(255,255,255,.38);letter-spacing:3px;text-transform:uppercase;}
.bo-val{font-family:'Bangers',cursive;font-size:clamp(28px,7.5vw,50px);color:#ffdd00;text-shadow:0 0 30px #ffaa00;letter-spacing:2px;}
.bo-sub{font-size:13px;color:rgba(255,255,255,.38);}
.bo-close{
  font-family:'Fredoka One',cursive;font-size:18px;
  padding:12px 38px;border:none;border-radius:40px;
  background:linear-gradient(135deg,#ffaa00,#ff5500);
  color:#fff;cursor:pointer;margin-top:4px;
  box-shadow:0 6px 22px rgba(255,110,0,.45);
  transition:transform .15s;
}
.bo-close:hover{transform:scale(1.06);}
.bo-close:active{transform:scale(.94);}

/* ─── GAME OVER ─── */
#sOver{
  background:radial-gradient(ellipse at 50% 0%,#1e0000 0%,#060006 55%,#000 100%);
  overflow:hidden;justify-content:flex-start;
  padding-top:clamp(8px,2.5vh,24px);
}
#goParticles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.gop{position:absolute;font-size:clamp(14px,3.5vw,26px);animation:goFall linear infinite;opacity:0;}
@keyframes goFall{
  0%{opacity:0;transform:translateY(-60px) rotate(0deg);}
  10%{opacity:.6;}90%{opacity:.3;}
  100%{opacity:0;transform:translateY(110vh) rotate(720deg);}
}
.go-inner{display:flex;flex-direction:column;align-items:center;z-index:2;width:100%;padding:0 14px;}
.go-title-wrap{position:relative;margin-bottom:8px;}
.go-title{
  font-family:'Bangers',cursive;
  font-size:clamp(60px,14vw,110px);
  color:#ff2200;letter-spacing:6px;line-height:1;
  animation:goShake .07s infinite alternate;text-align:center;
  text-shadow:0 0 40px rgba(255,40,0,.7),0 4px 0 rgba(100,0,0,.6);
}
@keyframes goShake{0%{transform:translateX(-2px) skewX(-.5deg);}100%{transform:translateX(2px) skewX(.5deg);}}
.go-subtitle{
  font-size:clamp(11px,2.2vw,14px);color:rgba(255,100,100,.5);
  letter-spacing:4px;text-transform:uppercase;text-align:center;margin-bottom:12px;
}
/* Score card */
.go-score-card{
  background:linear-gradient(150deg,rgba(255,40,0,.1),rgba(160,0,0,.15));
  border:1.5px solid rgba(255,60,0,.28);
  border-radius:24px;padding:16px 32px;text-align:center;
  margin-bottom:12px;width:100%;max-width:340px;
  box-shadow:0 0 50px rgba(255,30,0,.15),inset 0 1px 0 rgba(255,100,100,.06);
}
.go-sc-label{font-size:10px;color:rgba(255,255,255,.38);letter-spacing:4px;text-transform:uppercase;}
.go-sc-num{
  font-family:'Bangers',cursive;
  font-size:clamp(76px,17vw,120px);
  color:#fff;line-height:1;
  text-shadow:0 0 60px rgba(255,160,0,.9),0 4px 0 rgba(100,0,0,.4);
}
.go-sc-mode{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:4px;margin-top:2px;}
.go-new-best{
  display:none;font-family:'Bangers',cursive;
  font-size:26px;color:#ffdd00;letter-spacing:3px;
  text-shadow:0 0 22px #ffaa00;
  animation:bestPulse .55s ease-in-out infinite alternate;margin-top:4px;
}
.go-new-best.show{display:block;}
@keyframes bestPulse{0%{transform:scale(1);}100%{transform:scale(1.07);}}
/* Stats */
.go-stats{
  display:flex;gap:8px;margin-bottom:12px;
  flex-wrap:wrap;justify-content:center;width:100%;
}
.go-stat{
  background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:16px;padding:10px 14px;text-align:center;
  flex:1;min-width:84px;max-width:120px;
  transition:transform .15s;
}
.go-stat:hover{transform:scale(1.04);}
.go-stat-icon{font-size:22px;}
.go-stat-label{font-size:8px;color:rgba(255,255,255,.35);letter-spacing:2px;text-transform:uppercase;margin:3px 0 1px;}
.go-stat-val{font-family:'Bangers',cursive;font-size:26px;color:#fff;line-height:1;}
.go-stat-val.gold{color:#ffdd00;text-shadow:0 0 16px #ffaa00;}
/* Coins banner */
.go-coins-banner{
  background:linear-gradient(135deg,rgba(255,200,0,.13),rgba(255,130,0,.08));
  border:1.5px solid rgba(255,200,0,.25);
  border-radius:40px;padding:9px 26px;
  font-size:19px;color:#ffdd00;margin-bottom:14px;
  text-shadow:0 0 14px #ffaa00;
  animation:coinsBounce .45s ease-out;
  font-family:'Bangers',cursive;letter-spacing:1px;
}
@keyframes coinsBounce{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
/* Buttons */
.go-btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;}
.gbtn{
  font-family:'Fredoka One',cursive;font-size:16px;
  padding:11px 20px;border:none;border-radius:40px;cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;gap:7px;
  position:relative;overflow:hidden;
}
.gbtn::after{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:rgba(255,255,255,.1);pointer-events:none;
}
.gbtn:hover{transform:scale(1.08) translateY(-2px);}
.gbtn:active{transform:scale(.93);}
.gbp{background:linear-gradient(135deg,#ff6600,#ff1100);color:#fff;box-shadow:0 8px 26px rgba(255,50,0,.45);}
.gbs{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.18);}
.gbshare{background:linear-gradient(135deg,#1da1f2,#0d7abf);color:#fff;}
.gbcopy{background:linear-gradient(135deg,#25d366,#128c4e);color:#fff;}
.gbshop{background:linear-gradient(135deg,#ffbb00,#ff5500);color:#fff;}

/* Toast */
#copyToast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.88);color:#fff;
  padding:11px 26px;border-radius:30px;font-size:15px;
  z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
#copyToast.show{opacity:1;}

/* Countdown */
#countdown{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:none;align-items:center;justify-content:center;
  z-index:25;pointer-events:none;
}
#countdown.active{display:flex;}
#cdNum{
  font-family:'Bangers',cursive;
  font-size:clamp(100px,22vw,200px);
  color:#fff;
  text-shadow:0 0 70px rgba(255,180,0,1),0 6px 0 rgba(100,40,0,.5);
}
@keyframes cdPop{0%{transform:scale(2.5);opacity:0;}60%{transform:scale(.98);opacity:1;}100%{transform:scale(1);opacity:1;}}

/* Floating score popups */
.popup{
  position:fixed;font-family:'Bangers',cursive;
  font-size:30px;color:#ffdd00;
  text-shadow:0 0 18px #ff8800,2px 2px 0 rgba(0,0,0,.6);
  pointer-events:none;z-index:40;
  animation:popUp .8s ease-out forwards;
}
.popup.big{font-size:46px;color:#ff4400;}
@keyframes popUp{
  0%{opacity:1;transform:translateY(0) scale(.82);}
  35%{opacity:1;transform:translateY(-52px) scale(1.18);}
  100%{opacity:0;transform:translateY(-90px) scale(.88);}
}
@keyframes timePulse{0%,100%{color:#ff2200;}50%{color:#ffaa00;}}
.time-low{animation:timePulse .35s ease-in-out infinite !important;}
#bombFlash{
  position:fixed;inset:0;
  background:radial-gradient(circle,#fff 0%,#ff4400 40%,transparent 70%);
  z-index:998;pointer-events:none;opacity:0;transition:opacity .05s;
}
#bombFlash.boom{opacity:1;}
'''
