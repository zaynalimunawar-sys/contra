<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍉 Fruit Ninja</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000;
      overflow:hidden;
      touch-action:none;
      font-family:'Fredoka One',cursive;
      user-select:none;
    }
    canvas { display:block; position:absolute; top:0; left:0; cursor:none; }

    /* ══════════ HUD ══════════ */
    #hud {
      position:absolute; top:0; left:0; right:0;
      z-index:50; display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:14px 18px 0;
      pointer-events:none;
    }
    .hud-pill {
      background:rgba(0,0,0,0.6);
      border:2px solid rgba(255,255,255,0.15);
      border-radius:30px;
      padding:8px 22px;
      display:flex; flex-direction:column; align-items:center;
      backdrop-filter:blur(12px);
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
    }
    .hud-label { font-size:10px; letter-spacing:3px; color:rgba(255,255,255,0.45); text-transform:uppercase; }
    .hud-val   { font-size:30px; color:#fff; line-height:1; text-shadow:0 0 20px rgba(255,220,0,.8); }
    #livesVal  { font-size:18px; letter-spacing:5px; }
    #comboVal  { color:#ffcc00; text-shadow:0 0 25px #ff8800; }

    /* ══════════ SCREENS ══════════ */
    .screen {
      position:absolute; inset:0; z-index:200;
      display:flex; flex-direction:column;
      justify-content:center; align-items:center;
    }
    .screen.hide { display:none !important; }

    /* ── Home Screen ── */
    #homeScreen {
      background:radial-gradient(ellipse at 50% 30%, #2a0060 0%, #0d0020 60%, #000 100%);
      overflow:hidden;
    }
    #homeBg {
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 20% 80%, rgba(255,60,0,.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(100,0,255,.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255,150,0,.08) 0%, transparent 70%);
      pointer-events:none;
    }
    .dojo-line {
      position:absolute; bottom:0; left:0; right:0; height:3px;
      background:linear-gradient(90deg,transparent,#ff6600,#ffcc00,#ff6600,transparent);
      box-shadow:0 0 30px #ff6600, 0 0 60px #ff3300;
    }

    .home-logo {
      position:relative; text-align:center; z-index:5;
    }
    .logo-sub {
      font-family:'Bangers',cursive;
      font-size:clamp(14px,3.5vw,22px);
      color:#ff8800;
      letter-spacing:10px;
      text-shadow:0 0 20px #ff4400;
      margin-bottom:6px;
    }
    .logo-main {
      font-family:'Bangers',cursive;
      font-size:clamp(72px,18vw,140px);
      letter-spacing:4px;
      line-height:0.9;
      background:linear-gradient(180deg,#fff 0%,#ffdd00 35%,#ff6600 65%,#cc2200 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      filter:drop-shadow(0 0 40px rgba(255,100,0,.9));
      animation:logoPulse 2.5s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100%{filter:drop-shadow(0 0 30px rgba(255,100,0,.8));}
      50%{filter:drop-shadow(0 0 70px rgba(255,200,0,1));}
    }
    .logo-fruits {
      font-size:clamp(28px,6vw,46px);
      margin:14px 0 0;
      letter-spacing:10px;
      animation:floatFruits 2s ease-in-out infinite;
    }
    @keyframes floatFruits {
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-8px);}
    }

    /* Mode buttons */
    .mode-grid {
      display:flex; gap:16px; margin:36px 0 0; flex-wrap:wrap; justify-content:center;
      padding:0 20px;
    }
    .mode-btn {
      display:flex; flex-direction:column; align-items:center;
      padding:18px 28px;
      border:none; border-radius:24px; cursor:pointer;
      transition:all .2s; min-width:130px;
      position:relative; overflow:hidden;
    }
    .mode-btn::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
    }
    .mode-btn .mode-icon { font-size:36px; margin-bottom:6px; }
    .mode-btn .mode-name {
      font-family:'Fredoka One',cursive;
      font-size:18px; color:#fff; font-weight:bold;
      text-shadow:0 2px 4px rgba(0,0,0,.5);
    }
    .mode-btn .mode-desc { font-size:11px; color:rgba(255,255,255,.7); margin-top:2px; }
    .mode-btn:hover, .mode-btn:active { transform:scale(1.07) translateY(-3px); }
    .mode-classic {
      background:linear-gradient(135deg,#e65c00,#f9d423);
      box-shadow:0 8px 30px rgba(230,90,0,.5);
    }
    .mode-zen {
      background:linear-gradient(135deg,#1a78c2,#00d2ff);
      box-shadow:0 8px 30px rgba(0,150,255,.4);
    }
    .mode-arcade {
      background:linear-gradient(135deg,#6a0dad,#d63aff);
      box-shadow:0 8px 30px rgba(180,0,255,.4);
    }

    .best-row {
      margin-top:24px;
      font-size:16px; color:rgba(255,255,255,.4);
      letter-spacing:1px; z-index:5;
    }
    .best-row span { color:#ffcc00; font-size:18px; }

    /* ── Pause/Mode banner ── */
    #modeBanner {
      position:absolute; top:80px; left:50%; transform:translateX(-50%);
      z-index:50; pointer-events:none;
      font-size:14px; color:rgba(255,255,255,.5);
      letter-spacing:3px; text-transform:uppercase;
    }

    /* ── Game Over ── */
    #gameOverScreen {
      background:radial-gradient(ellipse at center, #1a0000 0%, #050000 100%);
    }
    .go-title {
      font-family:'Bangers',cursive;
      font-size:clamp(56px,14vw,110px);
      color:#ff1a00;
      text-shadow:0 0 50px #ff0000, 0 0 100px #ff2200;
      letter-spacing:4px;
      animation:shake .08s infinite alternate;
    }
    @keyframes shake {
      0%{transform:translateX(-2px);}100%{transform:translateX(2px);}
    }
    .go-mode  { font-size:16px; color:rgba(255,255,255,.4); letter-spacing:4px; margin:8px 0; text-transform:uppercase; }
    .go-score { font-size:clamp(24px,5vw,40px); color:#fff; margin:10px 0 4px; }
    .go-best  { font-size:20px; color:#ffcc00; margin-bottom:36px; }
    .btn-row  { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    .go-btn {
      font-family:'Fredoka One',cursive;
      font-size:20px; padding:14px 36px;
      border:none; border-radius:40px; cursor:pointer;
      transition:all .2s;
    }
    .go-btn.primary {
      background:linear-gradient(135deg,#ff6600,#ff2200);
      color:#fff;
      box-shadow:0 8px 30px rgba(255,60,0,.5);
    }
    .go-btn.secondary {
      background:rgba(255,255,255,.1);
      color:#fff; border:2px solid rgba(255,255,255,.2);
    }
    .go-btn:hover { transform:scale(1.06); }

    /* ── Popups ── */
    .popup {
      position:absolute; pointer-events:none; z-index:90;
      font-family:'Bangers',cursive;
      font-size:34px; color:#ffdd00;
      text-shadow:0 0 20px #ff8800, 2px 2px 0 #000;
      animation:popFloat 0.9s ease-out forwards;
    }
    .popup.big { font-size:52px; color:#ff4400; }
    @keyframes popFloat {
      0%  {opacity:1; transform:translateY(0) scale(.8);}
      30% {opacity:1; transform:translateY(-40px) scale(1.2);}
      100%{opacity:0; transform:translateY(-90px) scale(.9);}
    }

    /* ── Countdown ── */
    #countdown {
      position:absolute; inset:0; z-index:150;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none;
    }
    #countNum {
      font-family:'Bangers',cursive;
      font-size:200px; color:#fff;
      text-shadow:0 0 80px rgba(255,150,0,1);
      opacity:0;
      transition:opacity .1s;
    }

    /* ── Timer bar (Arcade mode) ── */
    #timerBar {
      position:absolute; bottom:0; left:0; right:0; height:6px;
      background:rgba(255,255,255,.1); z-index:60;
    }
    #timerFill {
      height:100%; width:100%;
      background:linear-gradient(90deg,#ff2200,#ffcc00,#00ff88);
      transition:width .1s linear;
      box-shadow:0 0 12px #ffcc00;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- HUD -->
<div id="hud" class="hide">
  <div class="hud-pill">
    <div class="hud-label">Score</div>
    <div class="hud-val" id="scoreVal">0</div>
  </div>
  <div class="hud-pill">
    <div class="hud-label">Lives</div>
    <div class="hud-val" id="livesVal">❤️❤️❤️</div>
  </div>
  <div class="hud-pill">
    <div class="hud-label">Combo</div>
    <div class="hud-val" id="comboVal">0x</div>
  </div>
</div>
<div id="modeBanner"></div>
<div id="timerBar" class="hide"><div id="timerFill"></div></div>

<!-- Countdown -->
<div id="countdown"><div id="countNum"></div></div>

<!-- HOME SCREEN -->
<div class="screen" id="homeScreen">
  <div id="homeBg"></div>
  <div class="dojo-line"></div>
  <div class="home-logo">
    <div class="logo-sub">⚔ SLICE EVERYTHING ⚔</div>
    <div class="logo-main">FRUIT<br>NINJA</div>
    <div class="logo-fruits">🍎 🍊 🍉 🍓 🥝</div>
  </div>
  <div class="mode-grid">
    <button class="mode-btn mode-classic" onclick="startGame('classic')">
      <span class="mode-icon">⚔️</span>
      <span class="mode-name">CLASSIC</span>
      <span class="mode-desc">3 lives · slice all</span>
    </button>
    <button class="mode-btn mode-zen" onclick="startGame('zen')">
      <span class="mode-icon">🧘</span>
      <span class="mode-name">ZEN</span>
      <span class="mode-desc">60s · no bombs</span>
    </button>
    <button class="mode-btn mode-arcade" onclick="startGame('arcade')">
      <span class="mode-icon">⚡</span>
      <span class="mode-name">ARCADE</span>
      <span class="mode-desc">Bananas = +time</span>
    </button>
  </div>
  <div class="best-row">Best: <span id="bestHome">0</span></div>
</div>

<!-- GAME OVER -->
<div class="screen hide" id="gameOverScreen">
  <div class="go-title">GAME OVER</div>
  <div class="go-mode" id="goMode">CLASSIC</div>
  <div class="go-score">Score: <strong id="goScore">0</strong></div>
  <div class="go-best" id="goBest"></div>
  <div class="btn-row">
    <button class="go-btn primary" id="goReplay">↩ RETRY</button>
    <button class="go-btn secondary" onclick="goHome()">🏠 HOME</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//   🍉 FRUIT NINJA — FULL REWRITE v3
// ════════════════════════════════════════════════
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; makeBG(); }
window.addEventListener('resize', resize);
resize();

// ── Persistent state ──
let bests = {classic:0, zen:0, arcade:0};
try { bests = JSON.parse(localStorage.getItem('fnBests')) || bests; } catch(e){}
function saveBests(){ localStorage.setItem('fnBests', JSON.stringify(bests)); }

// ── Game state ──
let mode = 'classic';
let score = 0, lives = 3, combo = 0, playing = false;
let arcadeTime = 60, zenTime = 60;
let comboTimer = null, spawnTimer = null;
let fruits = [], parts = [], blade = [], popups = [];
let bgGrad, bgGrad2;

const HEART = ['','❤️','❤️❤️','❤️❤️❤️'];
const FDATA = [
  {e:'🍎',j:'#ff5555'},{e:'🍊',j:'#ffaa33'},{e:'🍌',j:'#ffe566'},
  {e:'🍇',j:'#cc55cc'},{e:'🍉',j:'#ff6677'},{e:'🍓',j:'#ff3366'},
  {e:'🥝',j:'#aedd22'},{e:'🍍',j:'#ffe033'},{e:'🍒',j:'#ff2244'},
  {e:'🍑',j:'#ffaa88'},{e:'🥭',j:'#ffaa00'},{e:'🍋',j:'#ffee22'},
];

// ── Background ──
function makeBG(){
  bgGrad = ctx.createLinearGradient(0,0,0,H);
  if(mode==='zen'){
    bgGrad.addColorStop(0,'#001a33');
    bgGrad.addColorStop(1,'#002244');
  } else if(mode==='arcade'){
    bgGrad.addColorStop(0,'#1a0030');
    bgGrad.addColorStop(1,'#2d0050');
  } else {
    bgGrad.addColorStop(0,'#0d0020');
    bgGrad.addColorStop(0.6,'#1a003a');
    bgGrad.addColorStop(1,'#060010');
  }
}

// ── Spawn system ──
function scheduleSpawn(){
  if(!playing) return;
  let base = mode==='arcade' ? 500 : mode==='zen' ? 900 : 750;
  let fast = Math.min(score/50, 400);
  let delay = Math.max(250, base - fast + Math.random()*300);

  spawnTimer = setTimeout(()=>{
    if(!playing) return;
    let count = score > 200 && Math.random()<0.3 ? 2 : 1;
    for(let i=0;i<count;i++) spawnOne();
    scheduleSpawn();
  }, delay);
}

function spawnOne(){
  const isBomb = mode==='zen' ? false : Math.random() < 0.1;
  const fd = FDATA[Math.floor(Math.random()*FDATA.length)];
  const isBonus = mode==='arcade' && !isBomb && Math.random()<0.08; // banana time bonus

  // Multiple spawn lanes
  const lane = Math.floor(Math.random()*3);
  let sx, svx;
  if(lane===0){ sx=W*0.2; svx=2+Math.random()*4; }
  else if(lane===2){ sx=W*0.8; svx=-(2+Math.random()*4); }
  else { sx=W*0.35+Math.random()*W*0.3; svx=(Math.random()-.5)*8; }

  const speedY = -(H*(0.02+Math.random()*0.009));

  fruits.push({
    x:sx, y:H+80,
    vx:svx, vy:speedY, gravity:0.38,
    size:36+Math.random()*22,
    isBomb, isBonus,
    emoji: isBonus ? '🍌' : (isBomb ? '💣' : fd.e),
    juice: isBomb ? '#ff3300' : fd.j,
    sliced:false, alpha:1,
    rot:Math.random()*Math.PI*2,
    rotV:(Math.random()-.5)*0.1,
    wobble:0, wobbleV:(Math.random()-.5)*0.05,
    trail:[],
  });
}

// ── Particles ──
function burst(x,y,col,n=20){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=2+Math.random()*9;
    parts.push({
      x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,
      g:0.28, sz:2+Math.random()*5,
      col, alpha:1, decay:0.022+Math.random()*0.018,
    });
  }
}

// ── Score popup ──
function popup(x,y,txt,big=false){
  const d=document.createElement('div');
  d.className='popup'+(big?' big':'');
  d.textContent=txt;
  d.style.left=(x-40)+'px';
  d.style.top=(y-50)+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),950);
}

// ── HUD update ──
function updateHUD(){
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('livesVal').textContent=HEART[Math.max(0,lives)]||'💀';
  const cv=document.getElementById('comboVal');
  cv.textContent=combo+'x';
  cv.style.opacity=combo>=2?'1':'0.4';
  if(mode==='arcade'){
    document.getElementById('timerFill').style.width=(arcadeTime/60*100)+'%';
  } else if(mode==='zen'){
    document.getElementById('timerFill').style.width=(zenTime/60*100)+'%';
  }
}

// ── Slice check ──
function trySlice(x,y){
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    if(f.sliced) continue;
    if(Math.hypot(x-f.x,y-f.y)<f.size*0.72){
      f.sliced=true;
      burst(f.x,f.y,f.juice,f.isBomb?55:22);

      if(f.isBomb){
        burst(f.x,f.y,'#ff2200',60);
        burst(f.x,f.y,'#ffaa00',40);
        if(mode==='classic'){
          triggerGameOver();
        } else if(mode==='arcade'){
          arcadeTime=Math.max(0,arcadeTime-10);
        }
        return;
      }

      clearTimeout(comboTimer);
      combo++;
      comboTimer=setTimeout(()=>{ combo=0; updateHUD(); },1500);

      const mult=Math.max(1,combo);
      const pts=10*mult;
      score+=pts;

      if(f.isBonus && mode==='arcade'){
        arcadeTime=Math.min(60,arcadeTime+5);
        popup(f.x,f.y,'⏱ +5s',true);
      } else {
        popup(f.x,f.y,'+'+pts, combo>=3);
        if(combo>=3) popup(f.x,f.y-60,combo+'x COMBO!',true);
      }
      updateHUD();
    }
  }
}

// ── Blade drawing ──
function drawBlade(){
  if(blade.length<2) return;
  ctx.save();
  ctx.lineCap='round';
  ctx.lineJoin='round';
  for(let i=1;i<blade.length;i++){
    const t=i/blade.length;
    ctx.strokeStyle=`rgba(255,255,255,${t*0.9})`;
    ctx.shadowColor='rgba(180,220,255,1)';
    ctx.shadowBlur=30*t;
    ctx.lineWidth=14*t;
    ctx.beginPath();
    ctx.moveTo(blade[i-1].x,blade[i-1].y);
    ctx.lineTo(blade[i].x,blade[i].y);
    ctx.stroke();
  }
  // Tip glow
  const tip=blade[blade.length-1];
  ctx.shadowBlur=40;
  ctx.shadowColor='#fff';
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(tip.x,tip.y,5,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ── Main loop ──
let lastTime=0, arcadeInterval, zenInterval;

function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTime)/16.67,3); lastTime=ts;

  // Draw BG
  ctx.fillStyle=bgGrad||'#0d0020';
  ctx.fillRect(0,0,W,H);

  // Subtle glow orbs
  const orb=ctx.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,W*.6);
  orb.addColorStop(0,mode==='zen'?'rgba(0,80,180,.07)':mode==='arcade'?'rgba(140,0,220,.07)':'rgba(100,0,180,.07)');
  orb.addColorStop(1,'transparent');
  ctx.fillStyle=orb;
  ctx.fillRect(0,0,W,H);

  // Ground glow
  const gGrad=ctx.createLinearGradient(0,H-80,0,H);
  gGrad.addColorStop(0,'transparent');
  gGrad.addColorStop(1,'rgba(255,100,0,.08)');
  ctx.fillStyle=gGrad;
  ctx.fillRect(0,H-80,W,80);

  if(!playing){ drawBlade(); return; }

  // ── Fruits ──
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    f.vy+=f.gravity*dt;
    f.x+=f.vx*dt; f.y+=f.vy*dt;
    f.rot+=f.rotV*dt;
    f.wobble+=f.wobbleV;

    if(f.sliced){ f.alpha-=0.04*dt; }

    if(f.y>H+120&&!f.sliced){
      fruits.splice(i,1);
      if(!f.isBomb){
        if(mode==='classic'){
          lives--;
          // Miss flash
          const flash=document.createElement('div');
          flash.style.cssText='position:fixed;inset:0;background:rgba(255,0,0,.25);z-index:999;pointer-events:none;';
          document.body.appendChild(flash);
          setTimeout(()=>flash.remove(),200);
        }
        updateHUD();
        if(mode==='classic'&&lives<=0) triggerGameOver();
      }
      continue;
    }
    if(f.alpha<=0){ fruits.splice(i,1); continue; }

    // Draw
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.rot);

    if(!f.sliced){
      ctx.shadowColor='rgba(0,0,0,.5)';
      ctx.shadowBlur=20;
      ctx.shadowOffsetY=10;
    } else {
      ctx.shadowColor=f.juice;
      ctx.shadowBlur=50;
      ctx.scale(1+f.alpha*.15,1+f.alpha*.15);
    }

    ctx.globalAlpha=f.sliced?f.alpha:1;
    ctx.font=f.size+'px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(f.emoji,0,0);

    if(f.sliced){
      ctx.strokeStyle='rgba(255,255,255,.85)';
      ctx.lineWidth=2;
      ctx.shadowBlur=0;
      ctx.beginPath();
      ctx.moveTo(-f.size*.5,f.size*.4);
      ctx.lineTo(f.size*.5,-f.size*.4);
      ctx.stroke();
      // juice drops
      ctx.fillStyle=f.juice;
      for(let d=0;d<6;d++){
        const a=(d/6)*Math.PI*2+(1-f.alpha)*4;
        const r=f.size*.6*(1-f.alpha);
        ctx.globalAlpha=f.alpha*.7;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*r,Math.sin(a)*r,3,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ── Particles ──
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=p.g*dt; p.vx*=0.97;
    p.alpha-=p.decay*dt;
    if(p.alpha<=0){parts.splice(i,1);continue;}
    ctx.save();
    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.col;
    ctx.shadowColor=p.col; ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  drawBlade();
}

// ── Input ──
let pDown=false;
function onMove(x,y){
  if(!pDown) return;
  blade.push({x,y});
  if(blade.length>18) blade.shift();
  if(playing) trySlice(x,y);
}
canvas.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
canvas.addEventListener('mousedown',e=>{pDown=true;onMove(e.clientX,e.clientY);});
canvas.addEventListener('mouseup',()=>{pDown=false;blade=[];});
canvas.addEventListener('mouseleave',()=>{pDown=false;blade=[];});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); pDown=true;
  const t=e.touches[0]; onMove(t.clientX,t.clientY);
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0]; onMove(t.clientX,t.clientY);
},{passive:false});
canvas.addEventListener('touchend',()=>{pDown=false;blade=[];});

// ── Countdown then start ──
function countdown(cb){
  const el=document.getElementById('countNum');
  let n=3;
  function tick(){
    el.style.opacity='1';
    el.textContent=n;
    el.style.animation='none';
    void el.offsetWidth;
    el.style.animation='popFloat .9s ease-out forwards';
    setTimeout(()=>{ el.style.opacity='0'; },700);
    n--;
    if(n>0) setTimeout(tick,1000);
    else setTimeout(cb,1000);
  }
  tick();
}

// ── Start game ──
function startGame(m){
  mode=m||mode;
  document.getElementById('homeScreen').classList.add('hide');
  document.getElementById('gameOverScreen').classList.add('hide');
  document.getElementById('hud').classList.add('hide');

  countdown(()=>{
    score=0; lives=3; combo=0;
    arcadeTime=60; zenTime=60;
    fruits=[]; parts=[]; blade=[];
    playing=true;
    makeBG();
    updateHUD();
    document.getElementById('hud').classList.remove('hide');

    // Mode banner
    const banner=document.getElementById('modeBanner');
    const modeNames={classic:'⚔️ CLASSIC',zen:'🧘 ZEN MODE',arcade:'⚡ ARCADE'};
    banner.textContent=modeNames[mode];
    setTimeout(()=>banner.textContent='',3000);

    // Timer bar
    const tb=document.getElementById('timerBar');
    if(mode==='arcade'||mode==='zen'){
      tb.classList.remove('hide');
    } else {
      tb.classList.add('hide');
    }

    clearInterval(arcadeInterval);
    clearInterval(zenInterval);
    clearTimeout(spawnTimer);
    scheduleSpawn();

    if(mode==='arcade'){
      arcadeInterval=setInterval(()=>{
        if(!playing) return;
        arcadeTime=Math.max(0,arcadeTime-.1);
        updateHUD();
        if(arcadeTime<=0) triggerGameOver();
      },100);
    }
    if(mode==='zen'){
      zenInterval=setInterval(()=>{
        if(!playing) return;
        zenTime=Math.max(0,zenTime-.1);
        updateHUD();
        if(zenTime<=0) triggerGameOver();
      },100);
    }
  });
}

// ── Game Over ──
function triggerGameOver(){
  playing=false;
  clearTimeout(spawnTimer);
  clearInterval(arcadeInterval);
  clearInterval(zenInterval);
  document.getElementById('hud').classList.add('hide');
  document.getElementById('timerBar').classList.add('hide');

  const isNew=score>bests[mode];
  if(isNew){ bests[mode]=score; saveBests(); }

  setTimeout(()=>{
    document.getElementById('goMode').textContent=mode.toUpperCase()+' MODE';
    document.getElementById('goScore').textContent=score;
    document.getElementById('goBest').textContent=isNew?'🏆 NEW BEST!':'Best: '+bests[mode];
    document.getElementById('goReplay').onclick=()=>startGame(mode);
    document.getElementById('gameOverScreen').classList.remove('hide');
    document.getElementById('bestHome').textContent=Math.max(...Object.values(bests));
  },700);
}

function goHome(){
  playing=false;
  clearTimeout(spawnTimer);
  clearInterval(arcadeInterval);
  clearInterval(zenInterval);
  fruits=[]; parts=[];
  document.getElementById('gameOverScreen').classList.add('hide');
  document.getElementById('hud').classList.add('hide');
  document.getElementById('timerBar').classList.add('hide');
  document.getElementById('homeScreen').classList.remove('hide');
  document.getElementById('bestHome').textContent=Math.max(...Object.values(bests));
  makeBG();
}

// Start loop
document.getElementById('bestHome').textContent=Math.max(...Object.values(bests));
requestAnimationFrame(loop);
</script>
