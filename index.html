<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monster Arena - Gun Waves</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
  body{
    background:linear-gradient(135deg,#050814,#0a1a2f);
    display:flex;align-items:center;justify-content:center;
    height:100vh;color:#fff;overflow:hidden;
  }
  #game-wrapper{position:relative;}
  canvas{
    background:radial-gradient(circle at center,#0b1724,#050814);
    border-radius:20px;
    box-shadow:0 15px 50px rgba(0,100,200,0.4),inset 0 0 50px rgba(0,50,100,0.3);
    display:block;
  }
  #top-ui{
    position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:12px;
    font-weight:500;font-size:13px;pointer-events:none;
  }
  #bars{display:flex;flex-direction:column;gap:6px;}
  .bar{position:relative;height:12px;border-radius:8px;background:rgba(255,255,255,0.08);
       overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);}
  .bar-fill{height:100%;border-radius:8px;transition:width 0.2s ease;
            background:linear-gradient(90deg,#00ff88 0%,#00c0ff 50%,#0080ff 100%);
            box-shadow:0 0 12px rgba(0,255,136,0.6);}
  #xp-bar .bar-fill{background:linear-gradient(90deg,#ffc400 0%,#ff4d4d 50%,#ff0040 100%);
                    box-shadow:0 0 12px rgba(255,196,0,0.7);}
  .bar-label{font-size:12px;color:rgba(255,255,255,0.9);margin-bottom:2px;font-weight:500;}
  #info{
    background:rgba(10,20,40,0.8);backdrop-filter:blur(12px);
    padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);
    min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .info-line{font-size:12px;margin-bottom:4px;opacity:0.9;}
  .info-value{font-weight:600;color:#00ffcc;}
  .wave-circle{display:inline-block;width:20px;height:20px;background:#ff4d4d;
               border-radius:50%;margin-right:6px;box-shadow:0 0 8px rgba(255,77,77,0.6);}
  #message{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    font-size:12px;font-weight:500;opacity:0.85;text-shadow:0 1px 3px rgba(0,0,0,0.8);
    pointer-events:none;background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:20px;
  }
  /* Overlay */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
           display:none;align-items:center;justify-content:center;}
  .overlay.show{display:flex;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .panel{
    background:linear-gradient(145deg,#101a2a,#0a1420);
    padding:24px;border-radius:20px;width:340px;max-width:95vw;
    box-shadow:0 20px 40px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.1);
    text-align:center;border:1px solid rgba(255,255,255,0.08);
    transform:scale(0.95);animation:scaleIn 0.3s ease forwards;
  }
  @keyframes scaleIn{to{transform:scale(1);}}
  .panel h2{margin:0 0 8px;font-size:22px;background:linear-gradient(90deg,#00ff88,#00c0ff);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;}
  .panel p{font-size:13px;opacity:0.9;margin-bottom:16px;color:#ccc;}
  .choice{
    background:rgba(24,38,58,0.8);border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;
    text-align:left;overflow:hidden;position:relative;
  }
  .choice:hover{background:rgba(34,54,84,0.9);transform:translateY(-2px);
                box-shadow:0 8px 20px rgba(0,192,255,0.3);border-color:rgba(0,192,255,0.4);}
  .choice-title{font-weight:700;font-size:14px;margin-bottom:3px;color:#fff;}
  .choice-desc{font-size:12px;opacity:0.85;}
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game" width="900" height="600"></canvas>

  <div id="top-ui">
    <div id="bars">
      <div class="bar-label">❤️ HP</div>
      <div class="bar"><div id="hp-fill" class="bar-fill" style="width:100%"></div></div>
      <div class="bar-label">⭐ XP</div>
      <div id="xp-bar" class="bar"><div id="xp-fill" class="bar-fill" style="width:0%"></div></div>
    </div>
    <div id="info">
      <div class="info-line"><span class="wave-circle"></span><span id="wave-text" class="info-value">1</span></div>
      <div class="info-line">Level <span id="lvl-text" class="info-value">1</span></div>
      <div class="info-line">Time <span id="time-text">0.0s</span></div>
      <div class="info-line">Kills <span id="kills-text" class="info-value">0</span></div>
    </div>
  </div>

  <div id="message">WASD / Arrows • Auto-gun fires • XP orbs → Weapon choices!</div>

  <div id="level-up-panel" class="overlay">
    <div class="panel">
      <h2>Level Up! Wave <span id="wave-in-levelup">1</span></h2>
      <p>Choose your upgrade:</p>
      <div id="choices"></div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let keys = {}, particles = [];
addEventListener('keydown', e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if(e.key === ' ') paused = !paused;
});
addEventListener('keyup', e=>keys[e.key.toLowerCase()] = false);

function rand(a,b){return a+Math.random()*(b-a);}
function addParticle(x,y,vx,vy,color,size=2){
  particles.push({x,y,vx,vy,life:0.6,size,color});
}

const hpFill = document.getElementById('hp-fill');
const xpFill = document.getElementById('xp-fill');
const lvlText = document.getElementById('lvl-text');
const waveText = document.getElementById('wave-text');
const timeText = document.getElementById('time-text');
const killsText = document.getElementById('kills-text');
const levelPanel = document.getElementById('level-up-panel');
const choicesEl = document.getElementById('choices');
const waveInLevelup = document.getElementById('wave-in-levelup');

let player, enemies, xpOrbs, bullets, time, paused, killed, wave, waveTimer, waveBonusActive;
let gunFireTimer = 0;

/* Weapons: starts with gun! */
let weapons = {
  bulletGun: 2,  // starts firing!
  spinBlades: 0, // unlock via XP
  firewall: 0,
  shield: 0
};

function newRun(){
  player = {
    x: W/2, y:H/2, r:16,
    speed: 3.5,
    hp: 100,
    maxHp: 100,
    damage: 14,
    xp: 0,
    level: 1,
    xpToNext: 100,
    spinRadius: 55,
    trail: []
  };
  weapons = {bulletGun:2, spinBlades:0, firewall:0, shield:0};
  enemies = []; xpOrbs = []; bullets = []; particles = [];
  time = 0; wave = 1; waveTimer = 0; waveBonusActive = false;
  paused = false; killed = 0; gunFireTimer = 0;
  document.getElementById('message').textContent = '🔫 Auto-Gun Active • WASD Move • XP → Unlock Blades/Firewall!';
}

function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=-25;y=rand(50,H-50);}
  else if(side===1){x=W+25;y=rand(50,H-50);}
  else if(side===2){x=rand(50,W-50);y=-25;}
  else {x=rand(50,W-50);y=H+25;}
  const mult = 1 + (wave-1)*0.45;
  const hp = Math.round((35 + time*0.6) * mult);
  enemies.push({
    x,y,r:15 + Math.min(3,(wave-1)*0.2),
    speed:rand(1.6,2.3) * mult,
    hp, maxHp:hp,
    damage:12 + wave*0.6,
    deathParticles: false
  });
}

function spawnXp(x,y,count=3, bonus=false){
  for(let i=0;i<count;i++){
    xpOrbs.push({
      x: x+rand(-10,10), y: y+rand(-10,10),
      r: 5 + (bonus?2:0),
      value: bonus ? 18 : 6,
      vx: rand(-0.5,0.5), vy: rand(-0.5,0.5),
      bonus: bonus, twinkle: 0
    });
    if(bonus) for(let j=0;j<4;j++) addParticle(x,y,rand(-40,40),rand(-40,40),'#ffdd44');
  }
}

function spawnWaveBonus(){
  spawnXp(W/2, H/2, 12, true);
  addParticle(W/2, H/2, 0,0,'#ffff88',4);
  waveBonusActive = true;
}

function shootBullet(){
  if(enemies.length===0) return;
  let best=null, bestD=1e9;
  enemies.forEach(e=>{
    const d = Math.hypot(e.x-player.x,e.y-player.y);
    if(d<bestD){bestD=d;best=e;}
  });
  if(!best) return;
  const dx=best.x-player.x,dy=best.y-player.y;
  const d = Math.hypot(dx,dy)||1;
  bullets.push({
    x:player.x + dx/d*20, y:player.y + dy/d*20,
    vx:dx/d*9, vy:dy/d*9,
    r:5,
    damage: 22 * (1 + (weapons.bulletGun-1)*0.25),
    life:1.6
  });
  addParticle(player.x,player.y, dx/d*3, dy/d*3, '#66ddff',3);
}

function showLevelUp(){
  paused = true;
  waveInLevelup.textContent = wave;
  levelPanel.classList.add('show');
  choicesEl.innerHTML = '';

  const options = [
    {title:'🔫 Faster Gun',desc:'Bullets fire quicker.',apply:()=>{weapons.bulletGun = Math.min(5, weapons.bulletGun+1);}},
    {title:'🗡️ +1 Spin Blade',desc:'Unlock/add orbiting blades.',apply:()=>{weapons.spinBlades++;}},
    {title:'🔥 Stronger Firewall',desc:'Fire ring damages more.',apply:()=>{weapons.firewall = Math.min(4, weapons.firewall+1);}},
    {title:'🛡️ Shield',desc:'Block more enemy damage.',apply:()=>{weapons.shield = Math.min(4, weapons.shield+1);}},
    {title:'⚡ +30% Speed',desc:'Dodge like lightning!',apply:()=>{player.speed *= 1.3;}},
    {title:'❤️ +30 HP',desc:'Full heal + more max HP.',apply:()=>{player.maxHp += 30; player.hp = player.maxHp;}},
    {title:'💥 Bigger Gun',desc:'Bullets hit harder.',apply:()=>{player.damage *= 1.25;}}
  ];

  const picks = options.sort(()=>Math.random()-0.5).slice(0,3);
  picks.forEach(opt=>{
    const div = document.createElement('div');
    div.className='choice';
    div.innerHTML=`<div class="choice-title">${opt.title}</div><div class="choice-desc">${opt.desc}</div>`;
    div.onclick=()=>{
      opt.apply();
      levelPanel.classList.remove('show');
      paused=false;
      addParticle(player.x,player.y,0, -20,'#00ff88',6); // Level-up sparkle
    };
    choicesEl.appendChild(div);
  });
}

function update(dt){
  if(paused) return;

  time += dt; waveTimer += dt; gunFireTimer += dt;

  // Particles
  particles.forEach(p=>{
    p.x += p.vx; p.y += p.vy;
    p.life -= dt; p.vx *= 0.98; p.vy *= 0.98;
  });
  particles = particles.filter(p=>p.life>0);

  // Waves
  const waveDuration = 32;
  if(!waveBonusActive){
    const spawnInt = Math.max(0.35, 1.0 - time*0.007 - (wave-1)*0.06);
    if(waveTimer >= spawnInt){ waveTimer -= spawnInt; spawnEnemy(); }
  } else if(waveTimer > 5){
    waveBonusActive = false; wave++; waveTimer = 0;
  }

  if(waveTimer > waveDuration && enemies.length === 0 && !waveBonusActive){
    spawnWaveBonus(); waveTimer = 0;
  }

  // Auto-gun fire (starts at level 2 rate)
  if(gunFireTimer > 0.4 / weapons.bulletGun){
    gunFireTimer = 0;
    shootBullet();
  }

  // Movement (dt-normalized)
  let mx=0,my=0;
  if(keys['w']||keys['arrowup']) my-=1;
  if(keys['s']||keys['arrowdown']) my+=1;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  const mag = Math.hypot(mx,my);
  if(mag>0){
    mx/=mag; my/=mag;
    player.x += mx*player.speed;
    player.y += my*player.speed;
    // Trail
    player.trail.push({...player});
    if(player.trail.length>8) player.trail.shift();
  }
  player.x = Math.max(player.r,Math.min(W-player.r,player.x));
  player.y = Math.max(player.r,Math.min(H-player.r,player.y));

  // Enemies
  enemies.forEach(e=>{
    const dx=player.x-e.x, dy=player.y-e.y;
    const d = Math.hypot(dx,dy)||1;
    e.x += dx/d * e.speed;
    e.y += dy/d * e.speed;
    const playerDmg = e.damage * (1 - weapons.shield * 0.18);
    if(d < player.r + e.r){
      player.hp -= playerDmg * 0.03;
      addParticle(player.x,player.y, rand(-10,10),rand(-10,10),'#ff4444');
    }
  });

  // Bullets
  bullets.forEach(b=>{
    b.x += b.vx; b.y += b.vy; b.life -= dt;
  });
  bullets = bullets.filter(b=> b.life>0 && b.x>-30 && b.x<W+30 && b.y>-30 && b.y<H+30);

  // Blades (if unlocked)
  let blades = [];
  if(weapons.spinBlades > 0){
    for(let i=0; i<weapons.spinBlades; i++){
      const ang = time*4 + i * (Math.PI*2 / weapons.spinBlades);
      blades.push({
        x: player.x + Math.cos(ang)*player.spinRadius,
        y: player.y + Math.sin(ang)*player.spinRadius,
        r: 11
      });
    }
  }

  // Damage
  enemies.forEach(e=>{
    // Blades
    blades.forEach(b=>{
      const d = Math.hypot(e.x - b.x, e.y - b.y);
      if(d < e.r + b.r) e.hp -= player.damage * 0.04;
    });
    // Firewall
    if(weapons.firewall > 0){
      const d = Math.hypot(e.x-player.x, e.y-player.y);
      const ir = player.spinRadius + 6;
      const or_ = player.spinRadius + 28;
      if(d > ir && d < or_) e.hp -= player.damage * weapons.firewall * 0.025;
    }
  });

  // Bullet hits
  for(let i=bullets.length-1; i>=0; i--){
    const b = bullets[i];
    for(let j=enemies.length-1; j>=0; j--){
      const e = enemies[j];
      const d = Math.hypot(e.x-b.x, e.y-b.y);
      if(d < e.r + b.r){
        e.hp -= b.damage;
        bullets.splice(i,1);
        addParticle(e.x,e.y, rand(-20,20),rand(-20,20), '#66ddff',4);
        break;
      }
    }
  }

  // XP orbs
  xpOrbs.forEach(o=>{
    o.x += o.vx; o.y += o.vy; o.vx *= 0.95; o.vy *= 0.95; o.twinkle += dt;
    const dx = player.x - o.x, dy = player.y - o.y, d = Math.hypot(dx,dy)||1;
    if(d < 140){
      const pull = (140-d)/140 * 0.9;
      o.x += dx/d * pull * 9;
      o.y += dy/d * pull * 9;
    }
    if(d < player.r + o.r + 5){
      player.xp += o.value;
      addParticle(o.x,o.y, rand(-15,15),rand(-15,15), o.bonus ? '#ffff44' : '#ffc83d');
    }
  });
  xpOrbs = xpOrbs.filter(o => Math.hypot(player.x-o.x, player.y-o.y) >= player.r + o.r + 5);

  // Deaths
  enemies = enemies.filter(e=>{
    if(e.hp <= 0){
      spawnXp(e.x, e.y);
      for(let k=0; k<8; k++) addParticle(e.x,e.y, rand(-30,30),rand(-30,30),'#ff3d7d');
      killed++; return false;
    }
    return true;
  });

  // Level up
  while(player.xp >= player.xpToNext){
    player.xp -= player.xpToNext;
    player.level++;
    player.xpToNext = 100 + player.level * 28;
    showLevelUp();
  }

  // UI
  hpFill.style.width = Math.max(0, (player.hp/player.maxHp)*100) + '%';
  xpFill.style.width = (player.xp/player.xpToNext*100) + '%';
  lvlText.textContent = player.level;
  waveText.textContent = wave;
  timeText.textContent = time.toFixed(1);
  killsText.textContent = killed;

  if(player.hp <= 0){
    paused = true;
    document.getElementById('message').textContent = `💀 Died Wave ${wave} • Kills: ${killed} • Refresh!`;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // Enhanced grid
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  ctx.lineWidth=1;
  for(let x=0;x<=W;x+=45){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);
    ctx.stroke();
  }
  for(let y=0;y<=H;y+=45){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);
    ctx.stroke();
  }
  ctx.restore();

  // Particles
  particles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha = p.life / 0.6;
    ctx.beginPath(); ctx.arc(p.x,p.y, p.size * p.life/0.6, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.fill();
    ctx.restore();
  });

  // XP orbs (twinkle)
  xpOrbs.forEach(o=>{
    ctx.save();
    const alpha = 0.8 + Math.sin(o.twinkle*10)*0.2;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = o.bonus ? '#ffff88' : '#ffc83d';
    ctx.shadowBlur = 15;
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fillStyle = o.bonus ? '#ffdd44' : '#ffc83d';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.stroke();
    ctx.restore();
  });

  // Bullets (glow)
  bullets.forEach(b=>{
    ctx.save();
    ctx.shadowColor='#66ddff'; ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle='#66ddff';ctx.fill();
    ctx.restore();
  });

  // Enemies (pulse)
  enemies.forEach(e=>{
    ctx.save();
    const pulse = 0.9 + Math.sin(time*8 + e.x*0.01)*0.1;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*pulse,0,Math.PI*2);
    ctx.fillStyle='#ff3d7d';
    ctx.shadowColor='#ff3d7d'; ctx.shadowBlur=8;
    ctx.fill();
    ctx.shadowBlur=0;
    // HP
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,4);
    ctx.fillStyle='#ff8080';
    ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2*(e.hp/e.maxHp),4);
    ctx.restore();
  });

  // Blades
  if(weapons.spinBlades > 0){
    ctx.save();
    ctx.shadowColor='white'; ctx.shadowBlur=8;
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2.5;
    blades.forEach(b=>{
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
    });
    ctx.restore();
  }

  // Firewall
  if(weapons.firewall > 0){
    ctx.save();
    ctx.shadowColor='#ff8800'; ctx.shadowBlur=16;
    ctx.strokeStyle=`rgba(255,140,0,${0.6 + weapons.firewall*0.1})`;
    ctx.lineWidth=7;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.spinRadius+20,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // Player trail
  player.trail.forEach((t,i)=>{
    ctx.save();
    ctx.globalAlpha = i / player.trail.length * 0.6;
    ctx.beginPath();ctx.arc(t.x,t.y,player.r*0.6,0,Math.PI*2);
    ctx.fillStyle='#00ffcc';
    ctx.shadowColor='#00ffcc'; ctx.shadowBlur=10;
    ctx.fill();
    ctx.restore();
  });

  // Player
  ctx.save();
  ctx.shadowColor='#00ffcc'; ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  const grad = ctx.createRadialGradient(player.x-8,player.y-8,0,player.x,player.y,player.r);
  grad.addColorStop(0,'#00ffcc'); grad.addColorStop(1,'#0088aa');
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.stroke();
  ctx.restore();

  // Wave progress arc (center subtle)
  if(!waveBonusActive){
    const progress = Math.min(1, waveTimer / 32);
    ctx.save();
    ctx.strokeStyle='rgba(255,77,77,0.3)'; ctx.lineWidth=4;
    ctx.shadowColor='#ff4d4d'; ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.arc(W/2,H/2,60, -Math.PI/2, -Math.PI/2 + progress * Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

let lastTime = performance.now();
function loop(now){
  const dt = Math.min(1/30, (now - lastTime)/1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
newRun();
requestAnimationFrame(loop);
</script>
</body>
</html>
