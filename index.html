<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower TD - Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', monospace; color: #0f0; }
        canvas { display: block; background: linear-gradient(to bottom, #228b22, #006400); cursor: pointer; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 20px; text-shadow: 0 0 10px #0f0; }
        #left { display: flex; flex-direction: column; }
        #right { text-align: right; }
        #xpbar { width: 200px; height: 20px; background: #333; border: 2px solid #0f0; margin-top: 5px; }
        #xpfill { height: 100%; background: linear-gradient(#0f0, #0a0); transition: width 0.3s; box-shadow: 0 0 10px #0f0; }
        #placebtn { margin-top: 10px; padding: 8px 16px; background: #444; border: 2px solid #0f0; cursor: pointer; font-size: 16px; }
        #placebtn:hover { background: #555; box-shadow: 0 0 15px #0f0; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="left">
            <div>XP: <span id="xp">0</span>/50</div>
            <div id="xpbar"><div id="xpfill" style="width:0%"></div></div>
            <button id="placebtn" onclick="togglePlace()">🗼 Place Tower (50 XP)</button>
        </div>
        <div id="right">
            <div id="waveinfo">Wave: 1 | Lives: 20</div>
            <div>Kills: <span id="kills">0</span></div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const TILE = 40; // Bigger tiles
        const MAP_W = 20, MAP_H = 15;
        let cam = { x: 0, y: 0 };
        let placing = false;

        let game = {
            xp: 100, kills: 0, wave: 1, lives: 30, waveTimer: 0, nextSpawn: 0,
            towers: [], enemies: [], projectiles: []
        };

        // Path points (shorter map)
        const PATH = [
            {x: 0, y: 2}, {x: 8, y: 2}, {x: 8, y: 7}, {x: 18, y: 7}, {x: 18, y: 13}
        ];

        // Init map
        const MAP = Array(MAP_H).fill().map(() => Array(MAP_W).fill(0));
        PATH.forEach(p => MAP[p.y][p.x] = 1);

        class Tower {
            constructor(x, y) {
                this.x = x; this.y = y; this.range = 160; this.damage = 30; // Buffed
                this.cooldown = 0; this.target = null;
            }
            update(dt) {
                if (this.cooldown > 0) this.cooldown -= dt * 60;
                if (this.cooldown <= 0) {
                    this.target = game.enemies.find(e => dist(this.x, this.y, e.x, e.y) < this.range && e.health > 0);
                    if (this.target) {
                        game.projectiles.push(new Projectile(this.x, this.y, this.target, this.damage));
                        this.cooldown = 1; // 1s
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x - cam.x, this.y - cam.y);
                ctx.shadowColor = '#daa520'; ctx.shadowBlur = 15;
                ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.arc(0, 0, this.range, 0, Math.PI*2); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#cd853f'; ctx.fillRect(-15, -25, 30, 50);
                ctx.fillStyle = '#ffd700'; ctx.fillRect(-10, -30, 20, 15); // top
                ctx.restore();
            }
        }

        class Enemy {
            constructor() {
                this.pathIdx = 0;
                this.x = PATH[0].x * TILE + TILE/2;
                this.y = PATH[0].y * TILE + TILE/2;
                this.health = 40 + game.wave * 15;
                this.maxHealth = this.health;
                this.speed = 25 + game.wave * 2;
            }
            update(dt) {
                if (this.pathIdx >= PATH.length - 1) {
                    game.lives--; // Reached base
                    return false;
                }
                const target = PATH[this.pathIdx + 1];
                const tx = target.x * TILE + TILE/2;
                const ty = target.y * TILE + TILE/2;
                const dx = tx - this.x;
                const dy = ty - this.y;
                const d = Math.hypot(dx, dy);
                if (d < this.speed * dt) {
                    this.pathIdx++;
                } else {
                    this.x += (dx / d) * this.speed * dt;
                    this.y += (dy / d) * this.speed * dt;
                }
                return true;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x - cam.x, this.y - cam.y);
                ctx.shadowColor = '#f00'; ctx.shadowBlur = 10;
                const size = 20 + this.health / 10;
                ctx.fillStyle = '#8b0000'; ctx.fillRect(-size/2, -size/2, size, size);
                // Health
                ctx.fillStyle = '#f00'; ctx.fillRect(-size/2 - 2, -size/2 - 8, size + 4, 4);
                ctx.fillStyle = '#0f0'; ctx.fillRect(-size/2 - 2, -size/2 - 8, (size + 4) * (this.health / this.maxHealth), 4);
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        class Projectile {
            constructor(sx, sy, target, dmg) {
                this.sx = sx; this.sy = sy; this.target = target; this.dmg = dmg;
                this.speed = 400;
            }
            update(dt) {
                if (!this.target || this.target.health <= 0) return false;
                const dx = this.target.x - this.sx;
                const dy = this.target.y - this.sy;
                const d = Math.hypot(dx, dy);
                if (d < 8) {
                    this.target.health -= this.dmg;
                    if (this.target.health <= 0) {
                        game.kills++; game.xp += 15;
                    }
                    return false;
                }
                this.sx += (dx / d) * this.speed * dt;
                this.sy += (dy / d) * this.speed * dt;
                return true;
            }
            draw() {
                ctx.fillStyle = '#ff0'; ctx.shadowColor = '#ff0'; ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(this.sx - cam.x, this.sy - cam.y, 5, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function dist(x1,y1,x2,y2) { return Math.hypot(x1-x2, y1-y2); }

        function spawnWave() {
            const num = 4 + game.wave;
            for (let i = 0; i < num; i++) {
                setTimeout(() => {
                    const e = new Enemy();
                    game.enemies.push(e);
                }, i * 800);
            }
        }

        function togglePlace() {
            placing = !placing;
            document.getElementById('placebtn').textContent = placing ? 'Cancel Place' : '🗼 Place Tower (50 XP)';
            canvas.style.cursor = placing ? 'crosshair' : 'pointer';
        }

        function update(dt) {
            game.towers.forEach(t => t.update(dt));
            game.enemies.forEach((e, i) => {
                if (!e.update(dt)) game.enemies.splice(i, 1);
            });
            game.projectiles = game.projectiles.filter(p => p.update(dt));

            if (game.enemies.length === 0 && Date.now() > game.nextSpawn) {
                game.nextSpawn = Date.now() + 5000;
                spawnWave();
            }

            if (game.lives <= 0) {
                alert(`Game Over!\nWave ${game.wave} | Kills ${game.kills} | Refresh restart.`);
                location.reload();
            }

            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tiles
            for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
                const sx = x * TILE - cam.x;
                const sy = y * TILE - cam.y;
                if (sx + TILE < 0 || sx > canvas.width || sy + TILE < 0 || sy > canvas.height) continue;
                ctx.fillStyle = MAP[y][x] ? '#8b4513' : (placing ? '#90ee90' : '#228b22');
                ctx.fillRect(sx, sy, TILE, TILE);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(sx, sy, TILE, TILE);
            }

            game.towers.forEach(t => t.draw());
            game.enemies.forEach(e => e.draw());
            game.projectiles.forEach(p => p.draw());

            // Base
            ctx.fillStyle = '#ffdead'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
            ctx.fillRect((MAP_W-1)*TILE - cam.x, (MAP_H-1)*TILE - cam.y, TILE*2, TILE*2);
            ctx.shadowBlur = 0;
        }

        function updateUI() {
            document.getElementById('xp').textContent = game.xp;
            document.getElementById('xpfill').style.width = (game.xp / 50 * 100) + '%';
            document.getElementById('waveinfo').textContent = `Wave: ${game.wave} | Lives: ${game.lives}`;
            document.getElementById('kills').textContent = game.kills;
            document.getElementById('placebtn').disabled = game.xp < 50;
        }

        // Input
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('click', e => {
            if (!placing) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left + cam.x) / TILE);
            const y = Math.floor((e.clientY - rect.top + cam.y) / TILE);
            if (x >= 0 && x < MAP_W && y >= 0 && y < MAP_H && !MAP[y][x] && game.xp >= 50) {
                game.towers.push(new Tower(x * TILE + TILE/2, y * TILE + TILE/2));
                game.xp -= 50;
            }
        });

        function handleInput(dt) {
            const spd = 300 * dt;
            if (keys['w'] || keys['arrowup']) cam.y = Math.max(0, cam.y - spd);
            if (keys['s'] || keys['arrowdown']) cam.y = Math.min(MAP_H * TILE - canvas.height, cam.y + spd);
            if (keys['a'] || keys['arrowleft']) cam.x = Math.max(0, cam.x - spd);
            if (keys['d'] || keys['arrowright']) cam.x = Math.min(MAP_W * TILE - canvas.width, cam.x + spd);
        }

        // Touch
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchmove', e => {
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            cam.x -= dx * 0.8;
            cam.y -= dy * 0.8;
            cam.x = Math.max(0, Math.min(MAP_W * TILE - canvas.width, cam.x));
            cam.y = Math.max(0, Math.min(MAP_H * TILE - canvas.height, cam.y));
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        }, {passive: false});

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Game loop
        let lastTime = 0;
        function loop(time) {
            const dt = Math.min(1/60, (time - lastTime)/1000);
            lastTime = time;
            handleInput(dt);
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        game.nextSpawn = Date.now() + 3000;
        spawnWave();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
