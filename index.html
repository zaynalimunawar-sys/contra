<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Runner</title>
    <style>
        body { margin: 0; background: #006400; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; }
        canvas { border: 2px solid #228B22; background: linear-gradient(to bottom, #228B22, #006400); }
        #score { position: absolute; top: 10px; left: 10px; color: #FFD700; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #highScore { position: absolute; top: 40px; left: 10px; color: #FFA500; font-size: 18px; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="highScore">High: 0</div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');

        // Game state
        let score = 0;
        let highScore = localStorage.getItem('jungleHigh') || 0;
        highScoreEl.textContent = `High: ${highScore}`;
        let gameSpeed = 3;
        let player = { x: 180, y: 450, width: 40, height: 50, lane: 1, vy: 0 };
        let obstacles = [];
        let bananas = [];
        let keys = {};
        let gameRunning = true;
        let gameOver = false;

        // Lanes
        const lanes = [100, 180, 260];

        // Controls
        document.addEventListener('keydown', (e) => { keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        canvas.addEventListener('touchmove', handleTouch, { passive: false });

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (y < canvas.height / 2) {
                // Lane switch
                if (x < canvas.width / 3) player.lane = 0;
                else if (x < 2 * canvas.width / 3) player.lane = 1;
                else player.lane = 2;
            } else {
                // Jump or slide
                if (player.y === 450) {
                    if (y > canvas.height * 0.7) {
                        // Slide (temp crouch)
                        player.height = 25;
                        setTimeout(() => { player.height = 50; }, 300);
                    } else {
                        player.vy = -14;
                    }
                }
            }
        }

        // Spawn
        function spawnObstacle() {
            if (Math.random() < 0.025 + gameSpeed * 0.005) {
                const lane = Math.floor(Math.random() * 3);
                const type = Math.random() > 0.5 ? 'vine' : 'rock';
                obstacles.push({ x: lanes[lane], y: -60, width: 50, height: type === 'vine' ? 80 : 60, type });
            }
        }

        function spawnBanana() {
            if (Math.random() < 0.02 + gameSpeed * 0.003) {
                const lane = Math.floor(Math.random() * 3);
                bananas.push({ x: lanes[lane] + 10, y: -30, width: 20, height: 20, rot: 0 });
            }
        }

        // Update
        function update() {
            if (!gameRunning || gameOver) return;

            // Player
            player.vy += 0.7;
            player.y += player.vy;
            player.x = lanes[player.lane];
            if (player.y > 450) {
                player.y = 450;
                player.vy = 0;
            }

            // Move objects
            obstacles.forEach(o => o.y += gameSpeed);
            bananas.forEach(b => {
                b.y += gameSpeed;
                b.rot += 0.2;
            });

            // Clean up
            obstacles = obstacles.filter(o => o.y < canvas.height + 50);
            bananas = bananas.filter(b => b.y < canvas.height + 50);

            // Collisions
            obstacles.forEach((o, i) => {
                if (player.x < o.x + o.width &&
                    player.x + player.width > o.x &&
                    player.y < o.y + o.height &&
                    player.y + player.height > o.y) {
                    endGame();
                }
            });

            bananas.forEach((b, i) => {
                if (player.x < b.x + b.width &&
                    player.x + player.width > b.x &&
                    player.y < b.y + b.height &&
                    player.y + player.height > b.y) {
                    bananas.splice(i, 1);
                    score += 50;
                }
            });

            score += 1;
            scoreEl.textContent = `Score: ${score}`;
            gameSpeed += 0.002;

            spawnObstacle();
            spawnBanana();
        }

        function endGame() {
            gameRunning = false;
            gameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('jungleHigh', highScore);
                highScoreEl.textContent = `High: ${highScore}`;
            }
            setTimeout(() => {
                if (confirm(`Game Over! Score: ${score}\nPlay again?`)) {
                    resetGame();
                }
            }, 500);
        }

        function resetGame() {
            score = 0;
            gameSpeed = 3;
            player.y = 450;
            player.vy = 0;
            player.lane = 1;
            obstacles = [];
            bananas = [];
            gameRunning = true;
            gameOver = false;
        }

        // Render
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Jungle bg elements (trees, vines)
            ctx.fillStyle = 'rgba(0, 50, 0, 0.3)';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(i * 100 - (score / 10) % 100, 0, 60, canvas.height);
            }

            // Lanes
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(133, 0); ctx.lineTo(133, canvas.height);
            ctx.moveTo(266, 0); ctx.lineTo(266, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Player (monkey)
            ctx.fillStyle = '#8B4513';
            ctx.shadowColor = '#D2691E';
            ctx.shadowBlur = 15;
            ctx.fillRect(player.x + 5, player.y, 30, player.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x + 15, player.y + 5, 4, 4); // Eye
            ctx.shadowBlur = 0;

            // Obstacles
            obstacles.forEach(o => {
                ctx.shadowColor = o.type === 'vine' ? '#228B22' : '#8B0000';
                ctx.shadowBlur = 20;
                ctx.fillStyle = o.type === 'vine' ? '#228B22' : '#B22222';
                ctx.fillRect(o.x, o.y, o.width, o.height);
                ctx.shadowBlur = 0;
            });

            // Bananas
            bananas.forEach(b => {
                ctx.save();
                ctx.translate(b.x + 10, b.y + 10);
                ctx.rotate(b.rot);
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            });

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
                ctx.font = '24px Arial';
                ctx.fillText('Tap/Click to Restart', canvas.width/2, canvas.height/2 + 40);
            }
        }

        // Keyboard helper
        function handleKeys() {
            if (keys['ArrowLeft'] && player.lane > 0) player.lane--;
            if (keys['ArrowRight'] && player.lane < 2) player.lane++;
            if ((keys['ArrowUp'] || keys[' ']) && player.y === 450) player.vy = -14;
            if (keys['ArrowDown'] && player.y === 450) {
                player.height = 25;
                setTimeout(() => { player.height = 50; }, 300);
            }
        }

        setInterval(handleKeys, 50);

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('click', () => {
            if (gameOver) resetGame();
        });

        gameLoop();
    </script>
</body>
</html>
