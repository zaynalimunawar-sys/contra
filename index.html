<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monster Arena + Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
  body{
    background:#050814;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:#fff;
  }
  #game-wrapper{position:relative;}
  canvas{
    background:#0b1724;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,0.7);
    display:block;
  }
  #top-ui{
    position:absolute;
    left:0;top:0;width:100%;
    padding:8px 10px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    pointer-events:none;
  }
  #bars{display:flex;flex-direction:column;gap:4px;width:55%;}
  .bar{height:10px;border-radius:999px;background:rgba(255,255,255,0.12);overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,#00ff88,#00c0ff);width:50%;}
  #info{text-align:right;font-size:11px;opacity:0.8;}
  #message{
    position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
    font-size:11px;opacity:0.7;pointer-events:none;
  }

  /* level-up overlay */
  .overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.82);
    display:none;
    align-items:center;
    justify-content:center;
  }
  .overlay.show{display:flex;}
  .panel{
    background:#101a2a;
    padding:18px 20px;
    border-radius:12px;
    width:320px;
    max-width:95vw;
    box-shadow:0 8px 32px rgba(0,0,0,0.7);
    text-align:center;
  }
  .panel h2{margin-bottom:6px;font-size:18px;}
  .panel p{font-size:12px;opacity:0.85;margin-bottom:10px;}
  .choice{
    background:#18263a;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
    padding:8px;
    font-size:12px;
    text-align:left;
    margin-bottom:6px;
    cursor:pointer;
    transition:background 0.15s,transform 0.1s;
  }
  .choice:hover{background:#223654;transform:translateY(-1px);}
  .choice-title{font-weight:bold;margin-bottom:2px;}
  .choice-desc{font-size:11px;opacity:0.8;}

  /* shop */
  #shop-panel .panel{width:360px;}
  #shop-items{max-height:260px;overflow-y:auto;margin-top:6px;text-align:left;}
  .shop-item{
    border-radius:10px;
    padding:8px;
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#18263a;
    border:1px solid rgba(255,255,255,0.1);
    font-size:12px;
  }
  .shop-left{max-width:70%;}
  .shop-title{font-weight:bold;margin-bottom:2px;}
  .shop-desc{font-size:11px;opacity:0.8;}
  .shop-cost{font-size:11px;margin-top:4px;color:#ffd966;}
  .shop-btn{
    padding:6px 10px;
    border-radius:999px;
    border:none;
    background:#00c46a;
    color:#02140b;
    font-size:11px;
    cursor:pointer;
  }
  .shop-btn:disabled{
    background:#3a4658;
    color:#888;
    cursor:default;
  }
  #gold-text{font-size:12px;margin-top:6px;opacity:0.9;}
  #shop-close{
    margin-top:10px;
    padding:7px 16px;
    border-radius:999px;
    border:none;
    background:#00c46a;
    color:#02140b;
    font-size:12px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game" width="900" height="600"></canvas>

  <div id="top-ui">
    <div id="bars">
      <div style="font-size:11px;margin-bottom:2px;">HP</div>
      <div class="bar"><div id="hp-fill" class="bar-fill"></div></div>
      <div style="font-size:11px;margin:6px 0 2px;">XP</div>
      <div class="bar"><div id="xp-fill" class="bar-fill" style="width:0%;background:linear-gradient(90deg,#ffc400,#ff4d4d);"></div></div>
    </div>
    <div id="info">
      <div>Level: <span id="lvl-text">1</span></div>
      <div>Time: <span id="time-text">0.0</span>s</div>
      <div>Kills: <span id="kills-text">0</span></div>
      <div>Gold: <span id="gold-ui">0</span></div>
    </div>
  </div>

  <div id="message">Move with WASD / arrows • Space to pause • Shop appears after you die</div>

  <!-- Level up -->
  <div id="level-up-panel" class="overlay">
    <div class="panel">
      <h2>Level Up!</h2>
      <p>Choose one upgrade:</p>
      <div id="choices"></div>
    </div>
  </div>

  <!-- Shop (between runs) -->
  <div id="shop-panel" class="overlay">
    <div class="panel">
      <h2>Monster Shop</h2>
      <p>Spend gold on permanent upgrades for the next run.</p>
      <div id="gold-text">Gold: 0</div>
      <div id="shop-items"></div>
      <button id="shop-close">Start Next Run ▶</button>
    </div>
  </div>
</div>

<script>
/* ---------- Canvas / input ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let keys = {};
addEventListener('keydown', e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if(e.key === ' ') paused = !paused;
});
addEventListener('keyup', e=>{keys[e.key.toLowerCase()] = false;});

function rand(a,b){return a+Math.random()*(b-a);}

/* ---------- UI refs ---------- */
const hpFill = document.getElementById('hp-fill');
const xpFill = document.getElementById('xp-fill');
const lvlText = document.getElementById('lvl-text');
const timeText = document.getElementById('time-text');
const killsText = document.getElementById('kills-text');
const goldUI = document.getElementById('gold-ui');

const levelPanel = document.getElementById('level-up-panel');
const choicesEl = document.getElementById('choices');
const shopPanel = document.getElementById('shop-panel');
const shopItemsEl = document.getElementById('shop-items');
const shopGoldText = document.getElementById('gold-text');
const shopCloseBtn = document.getElementById('shop-close');

/* ---------- Meta progression ---------- */
let permanent = {
  gold: 0,
  baseDamageLevel: 0,
  baseSpeedLevel: 0,
  extraBladeLevel: 0,
  bulletGunLevel: 0,
  firewallLevel: 0
};

const shopItems = [
  { id:'dmg',   name:'+20% base damage',   desc:'Buff all weapons damage.',     baseCost:40, levelKey:'baseDamageLevel' },
  { id:'spd',   name:'+15% move speed',   desc:'Run faster to dodge mobs.',    baseCost:35, levelKey:'baseSpeedLevel' },
  { id:'blade', name:'+1 starting blade', desc:'Start each run with extra blade.', baseCost:50, levelKey:'extraBladeLevel' },
  { id:'gun',   name:'Unlock Bullet Gun', desc:'Shoots bullets at nearest enemy.', baseCost:60, levelKey:'bulletGunLevel' },
  { id:'wall',  name:'Unlock Fire Wall',  desc:'Spinning fire ring around you.',   baseCost:80, levelKey:'firewallLevel' }
];

/* ---------- Run state ---------- */
let player, enemies, xpOrbs, bullets, time, spawnTimer, paused, killed;

/* weapons flags (per run) */
let weapons = {
  spinBlades: true,
  bulletGun: false,
  firewall: false
};

/* ---------- Functions to reset a run ---------- */
function newRun(){
  player = {
    x: W/2, y:H/2, r:16,
    speed: 3.2 * (1 + permanent.baseSpeedLevel*0.15),
    hp: 100,
    maxHp: 100,
    damage: 10 * (1 + permanent.baseDamageLevel*0.2),
    xp: 0,
    level: 1,
    xpToNext: 30,
    spinBlades: 1 + permanent.extraBladeLevel,
    spinDamage: 10 * (1 + permanent.baseDamageLevel*0.2),
    spinRadius: 55
  };
  weapons.spinBlades = true;
  weapons.bulletGun = permanent.bulletGunLevel>0;
  weapons.firewall = permanent.firewallLevel>0;

  enemies = [];
  xpOrbs = [];
  bullets = [];
  time = 0;
  spawnTimer = 0;
  paused = false;
  killed = 0;
  document.getElementById('message').textContent =
    'Move with WASD / arrows • Space to pause';
}

/* ---------- Enemies / XP ---------- */
function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=-20;y=rand(0,H);}
  else if(side===1){x=W+20;y=rand(0,H);}
  else if(side===2){x=rand(0,W);y=-20;}
  else {x=rand(0,W);y=H+20;}
  const hp = 30 + time*0.7;
  enemies.push({
    x,y,r:14,
    speed:rand(1.5,2.1),
    hp,maxHp:hp,
    damage:10
  });
}

function spawnXp(x,y,count){
  for(let i=0;i<count;i++){
    xpOrbs.push({
      x: x+rand(-6,6),
      y: y+rand(-6,6),
      r: 4,
      value: 4,
      vx: rand(-0.5,0.5),
      vy: rand(-0.5,0.5)
    });
  }
}

/* ---------- Bullets ---------- */
function shootBullet(){
  if(!weapons.bulletGun) return;
  if(enemies.length===0) return;
  // find nearest enemy
  let best=null, bestD=1e9;
  enemies.forEach(e=>{
    const d = Math.hypot(e.x-player.x,e.y-player.y);
    if(d<bestD){bestD=d;best=e;}
  });
  if(!best) return;
  const dx=best.x-player.x,dy=best.y-player.y;
  const d = Math.hypot(dx,dy)||1;
  bullets.push({
    x:player.x,y:player.y,
    vx:dx/d*7,vy:dy/d*7,
    r:4,
    damage: 18 * (1 + permanent.baseDamageLevel*0.2),
    life:1.4
  });
}

/* ---------- Level-up overlay ---------- */
function showLevelUp(){
  paused = true;
  levelPanel.classList.add('show');
  choicesEl.innerHTML = '';

  const options = [
    {title:'+20% Damage',desc:'All weapons deal more damage.',apply:()=>{player.damage*=1.2;player.spinDamage*=1.2;bullets.forEach(b=>b.damage*=1.2);}},
    {title:'+15% Speed',desc:'Move faster to dodge enemies.',apply:()=>{player.speed*=1.15;}},
    {title:'+1 Blade',desc:'Gain another spinning blade.',apply:()=>{player.spinBlades+=1;}},
    {title:'+20% HP',desc:'Increase max HP & heal.',apply:()=>{player.maxHp=Math.round(player.maxHp*1.2);player.hp=Math.min(player.maxHp,player.hp+25);}},
    {title:'Bigger Radius',desc:'Blades orbit further out.',apply:()=>{player.spinRadius+=10;}}
  ];

  // If bullet gun not unlocked this run, allow a temporary unlock as a choice
  if(!weapons.bulletGun){
    options.push({
      title:'Unlock Gun (this run)',
      desc:'Shoots bullets at the nearest monster.',
      apply:()=>{weapons.bulletGun=true;}
    });
  }

  const picks = options.sort(()=>Math.random()-0.5).slice(0,3);
  picks.forEach(opt=>{
    const div = document.createElement('div');
    div.className='choice';
    div.innerHTML=`<div class="choice-title">${opt.title}</div>
                   <div class="choice-desc">${opt.desc}</div>`;
    div.onclick=()=>{
      opt.apply();
      levelPanel.classList.remove('show');
      paused=false;
    };
    choicesEl.appendChild(div);
  });
}

/* ---------- Shop overlay ---------- */
function updateShopUI(){
  shopGoldText.textContent = `Gold: ${permanent.gold}`;
  goldUI.textContent = permanent.gold;
  shopItemsEl.innerHTML='';

  shopItems.forEach(item=>{
    const level = permanent[item.levelKey];
    const cost = Math.round(item.baseCost * (1 + level*0.6));
    const wrap = document.createElement('div');
    wrap.className='shop-item';

    const left = document.createElement('div');
    left.className='shop-left';
    left.innerHTML=`<div class="shop-title">${item.name} (Lv ${level})</div>
                    <div class="shop-desc">${item.desc}</div>
                    <div class="shop-cost">Cost: ${cost} gold</div>`;
    const btn = document.createElement('button');
    btn.className='shop-btn';
    btn.textContent='Buy';
    btn.disabled = permanent.gold < cost;

    btn.onclick=()=>{
      if(permanent.gold<cost) return;
      permanent.gold -= cost;
      permanent[item.levelKey]++;
      updateShopUI();
    };

    wrap.appendChild(left);
    wrap.appendChild(btn);
    shopItemsEl.appendChild(wrap);
  });
}

shopCloseBtn.onclick=()=>{
  shopPanel.classList.remove('show');
  newRun();
};

/* ---------- Game loop ---------- */
let lastTime = performance.now();
let bulletTimer = 0;

function update(dt){
  if(paused) return;

  time += dt;
  spawnTimer += dt;
  bulletTimer += dt;

  // spawn enemies faster over time
  const interval = Math.max(0.35,1.2 - time*0.01);
  if(spawnTimer>=interval){spawnTimer=0;spawnEnemy();}

  // auto shooting
  if(bulletTimer>=0.6){
    bulletTimer=0;
    shootBullet();
  }

  // player movement
  let mx=0,my=0;
  if(keys['w']||keys['arrowup']) my-=1;
  if(keys['s']||keys['arrowdown']) my+=1;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  const mag=Math.hypot(mx,my);
  if(mag>0){
    mx/=mag;my/=mag;
    player.x+=mx*player.speed;
    player.y+=my*player.speed;
  }
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  // enemies chase
  enemies.forEach(e=>{
    const dx=player.x-e.x,dy=player.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    const vx=dx/d*e.speed,vy=dy/d*e.speed;
    e.x+=vx;e.y+=vy;
    if(d<player.r+e.r){
      player.hp-=e.damage*dt*0.6;
    }
  });

  // bullets
  bullets.forEach(b=>{
    b.x+=b.vx;
    b.y+=b.vy;
    b.life-=dt;
  });
  bullets = bullets.filter(b=>b.life>0 && b.x>-20 && b.x<W+20 && b.y>-20 && b.y<H+20);

  // spinning blades & firewall damage
  const blades=[];
  if(weapons.spinBlades){
    for(let i=0;i<player.spinBlades;i++){
      const ang = time*2 + i*(Math.PI*2/player.spinBlades);
      blades.push({x:player.x+Math.cos(ang)*player.spinRadius,y:player.y+Math.sin(ang)*player.spinRadius,r:10});
    }
  }

  enemies.forEach(e=>{
    // blades
    blades.forEach(b=>{
      const d=Math.hypot(e.x-b.x,e.y-b.y);
      if(d<e.r+b.r){
        e.hp-=player.spinDamage*dt*4;
      }
    });
    // firewall: ring around player
    if(weapons.firewall){
      const d=Math.hypot(e.x-player.x,e.y-player.y);
      const inner = player.spinRadius+8;
      const outer = player.spinRadius+26;
      if(d>inner && d<outer){
        e.hp-=player.damage*dt*1.8;
      }
    }
  });

  // bullet hit enemies
  bullets.forEach(b=>{
    enemies.forEach(e=>{
      const d=Math.hypot(e.x-b.x,e.y-b.y);
      if(d<e.r+b.r){
        e.hp-=b.damage;
        b.life=0;
      }
    });
  });

  // xp orbs movement
  xpOrbs.forEach(o=>{
    o.x+=o.vx;o.y+=o.vy;o.vx*=0.96;o.vy*=0.96;
    const dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy)||1;
    if(d<120){
      const pull=(120-d)/120*0.6;
      o.x+=dx/d*pull*7;
      o.y+=dy/d*pull*7;
    }
    if(d<player.r+o.r+2){
      player.xp+=o.value;
      o.collected=true;
    }
  });
  xpOrbs = xpOrbs.filter(o=>!o.collected);

  // enemy death
  enemies = enemies.filter(e=>{
    if(e.hp<=0){
      spawnXp(e.x,e.y,3);
      permanent.gold += 1;
      killed++;
      return false;
    }
    return true;
  });

  // level up
  while(player.xp>=player.xpToNext){
    player.xp-=player.xpToNext;
    player.level++;
    player.xpToNext = Math.floor(player.xpToNext*1.4);
    showLevelUp();
  }

  // UI
  hpFill.style.width = (player.hp/player.maxHp*100)+'%';
  xpFill.style.width = (player.xp/player.xpToNext*100)+'%';
  lvlText.textContent = player.level;
  timeText.textContent = time.toFixed(1);
  killsText.textContent = killed;
  goldUI.textContent = permanent.gold;

  if(player.hp<=0){
    paused=true;
    document.getElementById('message').textContent = 'You died! Spend your gold in the shop, then start another run.';
    // open shop
    updateShopUI();
    shopPanel.classList.add('show');
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  ctx.lineWidth=1;
  const grid=40;
  for(let x=0;x<=W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();

  // xp orbs
  xpOrbs.forEach(o=>{
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fillStyle='#ffc83d';ctx.fill();
  });

  // bullets
  bullets.forEach(b=>{
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle='#66ddff';ctx.fill();
  });

  // enemies
  enemies.forEach(e=>{
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle='#ff3d7d';ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);
    ctx.fillStyle='#ff8080';
    ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.maxHp),3);
  });

  // blades
  if(weapons.spinBlades){
    ctx.strokeStyle='rgba(255,255,255,0.45)';
    ctx.lineWidth=2;
    for(let i=0;i<player.spinBlades;i++){
      const ang=time*2 + i*(Math.PI*2/player.spinBlades);
      const bx=player.x+Math.cos(ang)*player.spinRadius;
      const by=player.y+Math.sin(ang)*player.spinRadius;
      ctx.beginPath();ctx.arc(bx,by,10,0,Math.PI*2);ctx.stroke();
    }
  }
  // firewall ring
  if(weapons.firewall){
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.spinRadius+18,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,120,0,0.6)';
    ctx.lineWidth=5;
    ctx.stroke();
  }

  // player
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle='#00ffcc';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#ffffff';ctx.stroke();
}

function loop(now){
  const dt=(now-lastTime)/1000;lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
newRun();
requestAnimationFrame(loop);
</script>
</body>
</html>
