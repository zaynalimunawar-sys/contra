!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zayn's Quiz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        radial-gradient(circle at 20% 20%, #3b82f6 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #7c3aed 0%, transparent 30%),
        linear-gradient(135deg, #080b18, #111936);

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    /* Background decorations */

    .circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.15;
      pointer-events: none;
    }

    .circle.one {
      width: 350px;
      height: 350px;
      background: #60a5fa;
      top: -150px;
      left: -100px;
    }

    .circle.two {
      width: 450px;
      height: 450px;
      background: #a78bfa;
      bottom: -220px;
      right: -150px;
    }

    /* Main card */

    .card {
      width: 90%;
      max-width: 850px;

      padding: 65px 50px;

      text-align: center;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);

      border-radius: 30px;

      backdrop-filter: blur(18px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45);

      animation: appear 0.7s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Game icon */

    .game-icon {
      font-size: 75px;
      margin-bottom: 10px;

      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
    }

    h1 {
      margin: 0;

      font-size: clamp(42px, 7vw, 72px);
      font-weight: 900;

      letter-spacing: -3px;

      text-shadow:
        0 5px 20px rgba(0,0,0,0.4);
    }

    .subtitle {
      margin-top: 15px;

      font-size: 21px;
      color: #cbd5ff;
    }

    /* Stats */

    .stats {
      display: flex;
      justify-content: center;
      gap: 15px;

      margin: 35px 0;
    }

    .stat {
      padding: 12px 20px;

      background: rgba(255,255,255,0.08);

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 12px;

      font-size: 15px;
      color: #dbeafe;
    }

    .stat strong {
      color: white;
      font-size: 18px;
    }

    /* Play button */

    .play-button {
      position: relative;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      padding: 18px 55px;

      border-radius: 16px;

      background: linear-gradient(
        135deg,
        #3b82f6,
        #6366f1
      );

      color: white;

      font-size: 23px;
      font-weight: 800;

      text-decoration: none;

      box-shadow:
        0 10px 30px rgba(59,130,246,0.35);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .play-button:hover {
      transform: translateY(-4px) scale(1.03);

      box-shadow:
        0 15px 40px rgba(59,130,246,0.5);
    }

    .play-button:active {
      transform: scale(0.97);
    }

    /* Bottom text */

    .hint {
      margin-top: 30px;

      font-size: 14px;

      color: #94a3b8;
    }

    .hint span {
      color: #60a5fa;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .card {
        padding: 45px 25px;
      }

      .stats {
        flex-direction: column;
        align-items: center;
      }

      .play-button {
        width: 100%;
      }

      h1 {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <div class="circle one"></div>
  <div class="circle two"></div>

  <main class="card">

    <div class="game-icon">
      🎮
    </div>

    <h1>
      ZAYN'S QUIZ
    </h1>

    <div class="subtitle">
      Think you're good enough? Prove it.
    </div>

    <div class="stats">

      <div class="stat">
        🎯 <strong>100+</strong><br>
        Minigames
      </div>

      <div class="stat">
        💀 <strong>1</strong><br>
        Player
      </div>

      <div class="stat">
        🏆 <strong>???</strong><br>
        Your Score
      </div>

    </div>

    <a
      class="play-button"
      href="https://docs.google.com/presentation/d/1e2EjsEnppZBh8cF2AVlxl77xWEE3dp4afM3IUkrn220/edit"
      target="_blank"
      rel="noopener noreferrer"
    >
      ▶️ PLAY QUIZ
    </a>

    <div class="hint">
      ⚠️ <span>Warning:</span>
      You may lose an unreasonable amount of points.
    </div>

  </main>

</body>
</html>
