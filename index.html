<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monster Arena - XP Waves</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
  body{
    background:#050814;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:#fff;
  }
  #game-wrapper{position:relative;}
  canvas{
    background:#0b1724;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,0.7);
    display:block;
  }
  #top-ui{
    position:absolute;
    left:0;top:0;width:100%;
    padding:8px 10px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    pointer-events:none;
  }
  #bars{display:flex;flex-direction:column;gap:4px;width:55%;}
  .bar{height:10px;border-radius:999px;background:rgba(255,255,255,0.12);overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,#00ff88,#00c0ff);width:50%;}
  #info{text-align:right;font-size:11px;opacity:0.8;}
  #message{
    position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
    font-size:11px;opacity:0.7;pointer-events:none;
  }
  .overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.82);
    display:none;
    align-items:center;
    justify-content:center;
  }
  .overlay.show{display:flex;}
  .panel{
    background:#101a2a;
    padding:18px 20px;
    border-radius:12px;
    width:320px;
    max-width:95vw;
    box-shadow:0 8px 32px rgba(0,0,0,0.7);
    text-align:center;
  }
  .panel h2{margin-bottom:6px;font-size:18px;}
  .panel p{font-size:12px;opacity:0.85;margin-bottom:10px;}
  .choice{
    background:#18263a;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
    padding:8px;
    font-size:12px;
    text-align:left;
    margin-bottom:6px;
    cursor:pointer;
    transition:background 0.15s,transform 0.1s;
  }
  .choice:hover{background:#223654;transform:translateY(-1px);}
  .choice-title{font-weight:bold;margin-bottom:2px;}
  .choice-desc{font-size:11px;opacity:0.8;}
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game" width="900" height="600"></canvas>

  <div id="top-ui">
    <div id="bars">
      <div style="font-size:11px;margin-bottom:2px;">HP</div>
      <div class="bar"><div id="hp-fill" class="bar-fill"></div></div>
      <div style="font-size:11px;margin:6px 0 2px;">XP</div>
      <div class="bar"><div id="xp-fill" class="bar-fill" style="width:0%;background:linear-gradient(90deg,#ffc400,#ff4d4d);"></div></div>
    </div>
    <div id="info">
      <div>Level: <span id="lvl-text">1</span></div>
      <div>Wave: <span id="wave-text">1</span></div>
      <div>Time: <span id="time-text">0.0</span>s</div>
      <div>Kills: <span id="kills-text">0</span></div>
    </div>
  </div>

  <div id="message">WASD/Arrows • Survive waves • XP = weapon choices!</div>

  <div id="level-up-panel" class="overlay">
    <div class="panel">
      <h2>Level Up! (Wave <span id="wave-in-levelup">1</span>)</h2>
      <p>Choose one:</p>
      <div id="choices"></div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let keys = {};
addEventListener('keydown', e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if(e.key === ' ') paused = !paused;
});
addEventListener('keyup', e=>{keys[e.key.toLowerCase()] = false;});

function rand(a,b){return a+Math.random()*(b-a);}

const hpFill = document.getElementById('hp-fill');
const xpFill = document.getElementById('xp-fill');
const lvlText = document.getElementById('lvl-text');
const waveText = document.getElementById('wave-text');
const timeText = document.getElementById('time-text');
const killsText = document.getElementById('kills-text');

const levelPanel = document.getElementById('level-up-panel');
const choicesEl = document.getElementById('choices');
const waveInLevelup = document.getElementById('wave-in-levelup');

let player, enemies, xpOrbs, bullets, blades, time, paused, killed, wave, waveTimer, waveBonusActive;

/* Weapons (per run, stackable) */
let weapons = {
  spinBlades: 1,  // count
  bulletGun: 0,   // rate (higher = faster fire)
  firewall: 0,    // damage mult
  shield: 0       // damage reduction
};

function newRun(){
  player = {
    x: W/2, y:H/2, r:16,
    speed: 3.5,
    hp: 100,
    maxHp: 100,
    damage: 12,
    xp: 0,
    level: 1,
    xpToNext: 100,
    spinRadius: 55
  };
  // Reset weapons to base
  weapons = {spinBlades:1, bulletGun:0, firewall:0, shield:0};

  enemies = []; xpOrbs = []; bullets = []; blades = [];
  time = 0; wave = 1; waveTimer = 0; waveBonusActive = false;
  paused = false; killed = 0;
  document.getElementById('message').textContent = 'WASD/Arrows • Space pause • XP orbs for level-ups!';
}

function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=-20;y=rand(0,H);}
  else if(side===1){x=W+20;y=rand(0,H);}
  else if(side===2){x=rand(0,W);y=-20;}
  else {x=rand(0,W);y=H+20;}
  const mult = 1 + (wave-1)*0.4;
  const hp = (30 + time*0.5) * mult;
  enemies.push({
    x,y,r:14 + (wave>5?1:0),
    speed:rand(1.5,2.2) * mult,
    hp, maxHp:hp,
    damage:10 + wave*0.5
  });
}

function spawnXp(x,y,count=3, bonus=false){
  for(let i=0;i<count;i++){
    xpOrbs.push({
      x: x+rand(-8,8),
      y: y+rand(-8,8),
      r: 5,
      value: bonus ? 15 : 5,
      vx: rand(-0.4,0.4),
      vy: rand(-0.4,0.4),
      bonus: bonus
    });
  }
}

function spawnWaveBonus(){
  // Big XP pile at center
  spawnXp(player.x, player.y, 8, true);
  waveBonusActive = true;
}

function shootBullet(){
  if(weapons.bulletGun < 1) return;
  if(enemies.length===0) return;
  let best=null, bestD=1e9;
  enemies.forEach(e=>{
    const d = Math.hypot(e.x-player.x,e.y-player.y);
    if(d<bestD){bestD=d;best=e;}
  });
  if(!best) return;
  const dx=best.x-player.x,dy=best.y-player.y;
  const d = Math.hypot(dx,dy)||1;
  bullets.push({
    x:player.x,y:player.y,
    vx:dx/d*8,vy:dy/d*8,
    r:4,
    damage: 20 * (1 + weapons.bulletGun*0.3),
    life:1.5
  });
}

function showLevelUp(){
  paused = true;
  waveInLevelup.textContent = wave;
  levelPanel.classList.add('show');
  choicesEl.innerHTML = '';

  const options = [
    {title:'+1 Spin Blade',desc:'More orbiting blades.',apply:()=>{weapons.spinBlades++;}},
    {title:'Faster Gun',desc:'Bullet gun shoots quicker.',apply:()=>{weapons.bulletGun = Math.min(4, weapons.bulletGun+1);}},
    {title:'Stronger Firewall',desc:'Fire ring burns harder.',apply:()=>{weapons.firewall = Math.min(3, weapons.firewall+1);}},
    {title:'Shield',desc:'Reduce incoming damage.',apply:()=>{weapons.shield = Math.min(3, weapons.shield+1);}},
    {title:'+25% Speed',desc:'Move faster!',apply:()=>{player.speed *= 1.25;}},
    {title:'+20 HP',desc:'More health.',apply:()=>{player.maxHp += 20; player.hp = player.maxHp;}},
    {title:'Bigger Blades',desc:'Blades orbit further.',apply:()=>{player.spinRadius += 8;}}
  ];

  const picks = options.sort(()=>Math.random()-0.5).slice(0,3);
  picks.forEach(opt=>{
    const div = document.createElement('div');
    div.className='choice';
    div.innerHTML=`<div class="choice-title">${opt.title}</div><div class="choice-desc">${opt.desc}</div>`;
    div.onclick=()=>{
      opt.apply();
      levelPanel.classList.remove('show');
      paused=false;
    };
    choicesEl.appendChild(div);
  });
}

function update(dt){
  if(paused) return;

  time += dt;
  waveTimer += dt;

  // Wave system: spawn during wave, bonus XP at end
  const waveDuration = 30;
  if(!waveBonusActive){
    const spawnInterval = Math.max(0.4, 1.1 - time*0.008 - (wave-1)*0.05);
    if(waveTimer >= spawnInterval){ waveTimer=0; spawnEnemy(); }
  } else {
    // Bonus collection phase
    if(waveTimer > 4){ // 4s bonus time
      waveBonusActive = false;
      wave++;
      waveTimer = 0;
    }
  }

  // Wave clear trigger
  if(waveTimer > waveDuration && enemies.length === 0 && !waveBonusActive){
    spawnWaveBonus();
    waveTimer = 0;
  }

  // Auto-shoot bullets
  if(weapons.bulletGun > 0 && Math.random() < weapons.bulletGun * dt * 2){
    shootBullet();
  }

  // Player movement
  let mx=0,my=0;
  if(keys['w']||keys['arrowup']) my-=1;
  if(keys['s']||keys['arrowdown']) my+=1;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  const mag=Math.hypot(mx,my);
  if(mag>0){
    mx/=mag;my/=mag;
    player.x+=mx*player.speed*dt*60;
    player.y+=my*player.speed*dt*60;
  }
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  // Enemies chase
  enemies.forEach(e=>{
    const dx=player.x-e.x,dy=player.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    e.x += (dx/d)*e.speed*dt*60;
    e.y += (dy/d)*e.speed*dt*60;
    const playerDamage = e.damage * (1 - weapons.shield*0.2);
    if(d < player.r + e.r){
      player.hp -= playerDamage * dt * 60 * 0.015;
    }
  });

  // Bullets update
  bullets.forEach(b=>{
    b.x+=b.vx*dt*60; b.y+=b.vy*dt*60; b.life-=dt;
  });
  bullets = bullets.filter(b=>b.life>0 && b.x>-20 && b.x<W+20 && b.y>-20 && b.y<H+20);

  // Weapons damage
  // Blades
  for(let i=0; i<weapons.spinBlades; i++){
    const ang = time*3 + i*(Math.PI*2/weapons.spinBlades);
    const bx=player.x+Math.cos(ang)*player.spinRadius;
    const by=player.y+Math.sin(ang)*player.spinRadius;
    blades[i] = {x:bx, y:by, r:10};
  }

  enemies.forEach(e=>{
    // Blades hit
    for(let i=0; i<weapons.spinBlades; i++){
      const b = blades[i];
      if(!b) continue;
      const d=Math.hypot(e.x-b.x, e.y-b.y);
      if(d < e.r + b.r){
        e.hp -= player.damage * dt * 60 * 0.025;
      }
    }
    // Firewall
    if(weapons.firewall > 0){
      const d=Math.hypot(e.x-player.x,e.y-player.y);
      const inner = player.spinRadius + 5;
      const outer = player.spinRadius + 25;
      if(d > inner && d < outer){
        e.hp -= player.damage * weapons.firewall * dt * 60 * 0.02;
      }
    }
  });

  // Bullet hits
  bullets.forEach(b=>{
    enemies.forEach(e=>{
      const d=Math.hypot(e.x-b.x,e.y-b.y);
      if(d < e.r + b.r){
        e.hp -= b.damage;
        b.life = 0;
      }
    });
  });

  // XP orbs
  xpOrbs.forEach(o=>{
    o.x+=o.vx; o.y+=o.vy; o.vx*=0.96; o.vy*=0.96;
    const dx=player.x-o.x,dy=player.y-o.y, d=Math.hypot(dx,dy)||1;
    if(d < 130){
      const pull=(130-d)/130 * 0.8;
      o.x += dx/d * pull * 8;
      o.y += dy/d * pull * 8;
    }
    if(d < player.r + o.r + 4){
      player.xp += o.value;
      o.collected = true;
    }
  });
  xpOrbs = xpOrbs.filter(o=>!o.collected);

  // Enemy deaths
  enemies = enemies.filter(e=>{
    if(e.hp <= 0){
      spawnXp(e.x, e.y);
      killed++;
      return false;
    }
    return true;
  });

  // Level up every ~100+ XP
  while(player.xp >= player.xpToNext){
    player.xp -= player.xpToNext;
    player.level++;
    player.xpToNext = 100 + player.level * 25;
    showLevelUp();
  }

  // UI
  hpFill.style.width = (player.hp/player.maxHp*100)+'%';
  xpFill.style.width = (player.xp/player.xpToNext*100)+'%';
  lvlText.textContent = player.level;
  waveText.textContent = wave;
  timeText.textContent = time.toFixed(1);
  killsText.textContent = killed;

  if(player.hp <= 0){
    paused = true;
    document.getElementById('message').textContent = `Died at Wave ${wave}! Refresh to restart.`;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // Grid
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  ctx.lineWidth=1;
  const grid=40;
  for(let x=0;x<=W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();

  // XP orbs (bonus glow)
  xpOrbs.forEach(o=>{
    ctx.save();
    ctx.globalAlpha = o.bonus ? 1 : 0.9;
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fillStyle= o.bonus ? '#ffdd44' : '#ffc83d'; ctx.fill();
    ctx.shadowColor='#ffff88'; ctx.shadowBlur=8;
    ctx.fill();
    ctx.restore();
  });

  // Bullets
  bullets.forEach(b=>{
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle='#66ddff';ctx.fill();
  });

  // Enemies (wave tint)
  enemies.forEach(e=>{
    ctx.save();
    ctx.globalAlpha = 0.8 + Math.sin(time*5)*0.1;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle='#ff3d7d';ctx.fill();
    ctx.restore();
    // HP bar
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);
    ctx.fillStyle='#ff8080';
    ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.maxHp),3);
  });

  // Blades
  ctx.strokeStyle='rgba(255,255,255,0.5)';
  ctx.lineWidth=3;
  for(let i=0; i<weapons.spinBlades; i++){
    const b = blades[i];
    if(b){
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
    }
  }

  // Firewall
  if(weapons.firewall > 0){
    ctx.save();
    ctx.shadowColor='#ff8800'; ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.spinRadius+17,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,120,0,'+(0.5+weapons.firewall*0.15)+')';
    ctx.lineWidth=6;
    ctx.stroke();
    ctx.restore();
  }

  // Player
  ctx.save();
  ctx.shadowColor='#00ffcc'; ctx.shadowBlur=15;
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle='#00ffcc';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#ffffff';ctx.stroke();
  ctx.restore();
}

let lastTime = performance.now();
function loop(now){
  const dt=(now-lastTime)/1000; lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
newRun();
requestAnimationFrame(loop);
</script>
</body>
</html>
