<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blob Jumper</title>
    <style>
        body { margin: 0; background: linear-gradient(to bottom, #87CEEB, #98FB98); color: #333; font-family: Arial; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        canvas { border: 3px solid #228B22; background: #90EE90; touch-action: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #ui { text-align: center; font-size: 24px; margin: 10px; font-weight: bold; }
        #start { padding: 15px 30px; font-size: 24px; background: #32CD32; border: none; color: white; cursor: pointer; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #start:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="ui">
        <div>Height: <span id="height">0</span>m | Best: <span id="best">0</span>m</div>
        <div>Gems: <span id="gems">0</span></div>
    </div>
    <canvas id="game" width="320" height="480"></canvas>
    <button id="startBtn" onclick="startGame()">🟢 Jump Adventure!</button>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const heightEl = document.getElementById('height');
        const bestEl = document.getElementById('best');
        const gemsEl = document.getElementById('gems');

        let gameState = 'menu'; // menu, playing, gameover
        let height = 0;
        let bestHeight = localStorage.getItem('blobBest') || 0;
        bestEl.textContent = Math.floor(bestHeight);
        let gems = 0;
        let multiplier = 1;
        let player = { x: 160, y: 400, vy: 0, size: 25, color: '#FF69B4' };
        let platforms = [{ x: 0, y: 420, width: canvas.width, height: 20, speed: 0 }];
        let gemPlatforms = [];
        let spikes = [];
        let particles = [];
        let scrollOffset = 0;
        let gameSpeed = 1;

        bestEl.textContent = Math.floor(bestHeight);

        // Controls
        let jumping = false;
        canvas.addEventListener('touchstart', jump);
        canvas.addEventListener('click', jump);
        window.addEventListener('keydown', e => { if (e.code === 'Space') jump(); });

        function jump() {
            if (gameState === 'playing' && player.vy > -1) {
                player.vy = -12;
                jumping = true;
            }
        }

        function startGame() {
            gameState = 'playing';
            document.getElementById('startBtn').style.display = 'none';
            height = 0;
            gems = 0;
            multiplier = 1;
            player = { x: 160, y: 400, vy: 0, size: 25 };
            platforms = [{ x: 0, y: 420, width: canvas.width, height: 20, speed: 0 }];
            gemPlatforms = [];
            spikes = [];
            particles = [];
            scrollOffset = 0;
            gameSpeed = 1;
            updateUI();
            gameLoop();
        }

        function update() {
            height += gameSpeed * 0.5;
            gameSpeed += 0.0005;
            scrollOffset += gameSpeed;

            // Player physics
            player.vy += 0.6;
            player.y += player.vy * 0.8;
            player.x += (Math.sin(height * 0.01) * 2); // Gentle sway

            // Platform collision
            let onPlatform = false;
            platforms.forEach(p => {
                if (player.x > p.x && player.x < p.x + p.width &&
                    player.y + player.size > p.y && player.y + player.size < p.y + 30 &&
                    player.vy > 0) {
                    player.y = p.y - player.size;
                    player.vy = 0;
                    onPlatform = true;
                }
            });
            if (!onPlatform && player.y > canvas.height + 50) endGame();

            // Spawn platforms
            if (platforms[platforms.length - 1].y < 200 - scrollOffset) {
                const lastP = platforms[platforms.length - 1];
                const gap = 80 + Math.random() * 40;
                const newX = Math.random() * (canvas.width - 120) + 60;
                const newWidth = 120 + Math.random() * 80;
                platforms.push({ x: newX, y: lastP.y - gap, width: newWidth, height: 20, speed: (Math.random() - 0.5) * 2 });

                // Random gem platform (10% chance)
                if (Math.random() < 0.15) {
                    gemPlatforms.push({ x: newX + 20, y: lastP.y - gap - 10, collected: false });
                }

                // Spikes (5% chance on narrow platforms)
                if (newWidth < 140 && Math.random() < 0.2) {
                    spikes.push({ x: newX + newWidth/2 - 15, y: lastP.y - gap + 5, hit: false });
                }

                // Cleanup old platforms
                if (platforms.length > 15) platforms.shift();
            }

            // Update platforms (side movement)
            platforms.forEach(p => {
                p.x += p.speed;
                if (p.x < -20 || p.x > canvas.width) p.x = canvas.width / 2;
            });

            // Gems
            gemPlatforms.forEach((g, i) => {
                if (!g.collected && Math.abs(player.x - g.x) < 25 && Math.abs(player.y - g.y) < 25) {
                    gems++;
                    multiplier = Math.min(5, multiplier + 0.2);
                    g.collected = true;
                    createParticles(g.x + 15, g.y + 15);
                    updateUI();
                }
            });

            // Spikes
            spikes.forEach(s => {
                if (!s.hit && Math.abs(player.x - s.x) < 20 && Math.abs(player.y - s.y) < 30) {
                    endGame();
                }
            });

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            });

            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Clouds background
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let i = 0; i < 5; i++) {
                const cx = (i * 200 + scrollOffset * 0.3) % (canvas.width + 100) - 50;
                ctx.beginPath();
                ctx.arc(cx, 100 + i * 30 - scrollOffset * 0.1, 30, 0, Math.PI * 2);
                ctx.arc(cx + 40, 100 + i * 30 - scrollOffset * 0.1, 35, 0, Math.PI * 2);
                ctx.arc(cx + 80, 100 + i * 30 - scrollOffset * 0.1, 30, 0, Math.PI * 2);
                ctx.fill();
            }

            // Platforms (green grass)
            ctx.fillStyle = '#228B22';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y - scrollOffset, p.width, p.height);
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(p.x, p.y - scrollOffset, p.width, 8);
            });

            // Gems (shiny)
            ctx.fillStyle = '#FFD700';
            gemPlatforms.forEach(g => {
                if (!g.collected) {
                    ctx.beginPath();
                    ctx.arc(g.x + 15 - scrollOffset * 0.5, g.y + 15 - scrollOffset, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFF';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Spikes
            ctx.fillStyle = '#FF4444';
            spikes.forEach(s => {
                ctx.beginPath();
                ctx.moveTo(s.x + 15 - scrollOffset * 0.5, s.y + 25 - scrollOffset);
                ctx.lineTo(s.x - scrollOffset * 0.5, s.y + 40 - scrollOffset);
                ctx.lineTo(s.x + 30 - scrollOffset * 0.5, s.y + 40 - scrollOffset);
                ctx.fill();
            });

            // Player blob
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 3;
            ctx.stroke();
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(player.x - 8, player.y - 5, 4, 0, Math.PI * 2);
            ctx.arc(player.x + 8, player.y - 5, 4, 0, Math.PI * 2);
            ctx.fill();

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = `rgba(255, 215, 0, ${p.life / 30})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y - scrollOffset, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // UI overlay
            ctx.fillStyle = `rgba(0,0,0,0.1)`;
            ctx.fillRect(0, 0, canvas.width, 60);
        }

        function createParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 20,
                    y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    life: 30
                });
            }
        }

        function updateUI() {
            heightEl.textContent = Math.floor(height);
            gemsEl.textContent = gems;
        }

        function endGame() {
            gameState = 'gameover';
            if (height > bestHeight) {
                bestHeight = height;
                localStorage.setItem('blobBest', bestHeight);
                bestEl.textContent = Math.floor(bestHeight);
            }
            setTimeout(() => {
                alert(`Jumped ${Math.floor(height)}m! Gems: ${gems} | Best: ${Math.floor(bestHeight)}m`);
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('startBtn').textContent = 'Jump Again! 🟢';
            }, 500);
        }

        function gameLoop() {
            if (gameState === 'playing') {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            } else {
                draw();
            }
        }
    </script>
</body>
</html>
