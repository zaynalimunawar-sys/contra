<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temu Fruit Ninja</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Arial", sans-serif;
      background-color: #00cccc;
      user-select: none;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 24px;
      z-index: 1000;
      text-shadow: 1px 1px 3px black;
    }

    #score,
    #misses {
      margin: 4px 0;
    }

    .fruit {
      position: absolute;
      font-size: 40px;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    .fruit::before {
      content: attr(data-fruit);
    }

    .sliced {
      opacity: 0.3;
      transform: translate(-50%, -50%) rotate(45deg);
      pointer-events: none;
    }

    #gameover {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      font-size: 28px;
      display: none;
      z-index: 1000;
    }

    #gameover button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 20px;
      border: none;
      background-color: #ff0066;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div id="score">Score: 0</div>
      <div id="misses">Misses: 0</div>
    </div>

    <div id="gameover">
      <div>Game Over!</div>
      <div id="final-score">Score: 0</div>
      <button id="restart">Play Again</button>
    </div>
  </div>

  <script>
    // Game settings
    const maxScore = 50;
    const maxMisses = 10;
    const minFruitTimeMs = 500;
    const maxFruitTimeMs = 2000;

    // Fruits (you can change these to Temu‑style images later)
    const fruits = ["🍏", "🍊", "🍓", "🍌", "🍉", "🍍", "🥭", "🥝", "🍅", "🥑"];

    // Game state
    let score = 0;
    let misses = 0;
    let isGameOver = false;

    const gameContainer = document.getElementById("game-container");
    const scoreEl = document.getElementById("score");
    const missesEl = document.getElementById("misses");
    const gameoverEl = document.getElementById("gameover");
    const finalScoreEl = document.getElementById("final-score");
    const restartBtn = document.getElementById("restart");

    function updateUI() {
      scoreEl.textContent = `Score: ${score}`;
      missesEl.textContent = `Misses: ${misses}`;
    }

    function makeFruit() {
      if (isGameOver) return;

      const fruitEl = document.createElement("div");
      fruitEl.classList.add("fruit");

      const fruit = fruits[Math.floor(Math.random() * fruits.length)];
      fruitEl.setAttribute("data-fruit", fruit);

      const w = gameContainer.clientWidth;
      const h = gameContainer.clientHeight;

      const x = Math.random() * (w - 100) + 50;
      const y = -100;

      fruitEl.style.left = `${x}px`;
      fruitEl.style.top = `${y}px`;

      const vx = (Math.random() - 0.5) * 3;
      const vy = 3 + Math.random() * 2;

      let xCurr = x;
      let yCurr = y;

      function slice() {
        if (fruitEl.classList.contains("sliced")) return;
        fruitEl.classList.add("sliced");
        score += 1;
        updateUI();
        if (score >= maxScore) gameOver();
        setTimeout(() => fruitEl.remove(), 500);
      }

      function move() {
        if (isGameOver) return;

        xCurr += vx;
        yCurr += vy;

        fruitEl.style.left = `${xCurr}px`;
        fruitEl.style.top = `${yCurr}px`;

        if (yCurr > h + 100) {
          if (!fruitEl.classList.contains("sliced")) {
            misses += 1;
            updateUI();
            if (misses >= maxMisses) gameOver();
          }
          fruitEl.remove();
        } else {
          requestAnimationFrame(move);
        }
      }

      fruitEl.addEventListener("click", slice);
      if ("ontouchstart" in window) {
        fruitEl.addEventListener("touchstart", slice);
      }

      gameContainer.appendChild(fruitEl);
      move();
    }

    function spawnLoop() {
      if (isGameOver) return;

      makeFruit();

      const next = Math.random() * (maxFruitTimeMs - minFruitTimeMs) + minFruitTimeMs;
      setTimeout(spawnLoop, next);
    }

    function gameOver() {
      isGameOver = true;
      gameoverEl.style.display = "block";
      finalScoreEl.textContent = `Score: ${score}`;
    }

    restartBtn.addEventListener("click", () => {
      gameoverEl.style.display = "none";
      isGameOver = false;
      score = 0;
      misses = 0;
      updateUI();

      // Remove all fruits
      document.querySelectorAll(".fruit").forEach((el) => el.remove());

      spawnLoop();
    });

    // Start
    spawnLoop();
    updateUI();
  </script>
</body>
</html>
