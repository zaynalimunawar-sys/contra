<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monster Arena Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
  body{
    background:#050814;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:#fff;
  }
  #game-wrapper{
    position:relative;
  }
  canvas{
    background:#0b1724;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,0.7);
    display:block;
  }
  #top-ui{
    position:absolute;
    left:0;top:0;width:100%;
    padding:8px 10px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    pointer-events:none;
  }
  #bars{
    display:flex;
    flex-direction:column;
    gap:4px;
    width:55%;
  }
  .bar{
    height:10px;
    border-radius:999px;
    background:rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg,#00ff88,#00c0ff);
    width:50%;
  }
  #info{
    text-align:right;
    font-size:11px;
    opacity:0.8;
  }
  #level-up-panel{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.82);
    display:none;
    align-items:center;
    justify-content:center;
  }
  #level-up-panel.show{
    display:flex;
  }
  #level-up-box{
    background:#101a2a;
    padding:18px 20px;
    border-radius:12px;
    width:280px;
    box-shadow:0 8px 32px rgba(0,0,0,0.7);
    text-align:center;
  }
  #level-up-box h2{
    margin-bottom:6px;
    font-size:18px;
  }
  #level-up-box p{
    font-size:12px;
    opacity:0.8;
    margin-bottom:10px;
  }
  .choice{
    background:#18263a;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
    padding:8px;
    font-size:12px;
    text-align:left;
    margin-bottom:6px;
    cursor:pointer;
    transition:background 0.15s, transform 0.1s;
  }
  .choice:hover{
    background:#223654;
    transform:translateY(-1px);
  }
  .choice-title{
    font-weight:bold;
    margin-bottom:2px;
  }
  .choice-desc{
    font-size:11px;
    opacity:0.8;
  }
  #message{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    opacity:0.7;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game" width="900" height="600"></canvas>

  <div id="top-ui">
    <div id="bars">
      <div style="font-size:11px;margin-bottom:2px;">HP</div>
      <div class="bar"><div id="hp-fill" class="bar-fill"></div></div>
      <div style="font-size:11px;margin:6px 0 2px;">XP</div>
      <div class="bar"><div id="xp-fill" class="bar-fill" style="width:0%;background:linear-gradient(90deg,#ffc400,#ff4d4d);"></div></div>
    </div>
    <div id="info">
      <div>Level: <span id="lvl-text">1</span></div>
      <div>Time: <span id="time-text">0.0</span>s</div>
      <div>Kills: <span id="kills-text">0</span></div>
    </div>
  </div>

  <div id="level-up-panel">
    <div id="level-up-box">
      <h2>Level Up!</h2>
      <p>Choose one upgrade:</p>
      <div id="choices"></div>
    </div>
  </div>

  <div id="message">Move with WASD / arrows · Space to pause</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const hpFill = document.getElementById('hp-fill');
const xpFill = document.getElementById('xp-fill');
const lvlText = document.getElementById('lvl-text');
const timeText = document.getElementById('time-text');
const killsText = document.getElementById('kills-text');

const levelPanel = document.getElementById('level-up-panel');
const choicesEl = document.getElementById('choices');

let keys = {};
addEventListener('keydown', e => {
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if(e.key === ' ') paused = !paused;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function randRange(a,b){return a+Math.random()*(b-a);}

const player = {
  x: W/2,
  y: H/2,
  r: 16,
  speed: 3.2,
  hp: 100,
  maxHp: 100,
  damage: 10,
  xp: 0,
  level: 1,
  xpToNext: 30,
  spinBlades: 1,       // how many spinning blades
  spinDamage: 10,
  spinRadius: 55
};

let enemies = [];
let bullets = [];  // not used yet, but you can add ranged attacks later
let xpOrbs = [];

let time = 0;
let lastFrame = performance.now();
let spawnTimer = 0;
let paused = false;
let killed = 0;

function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  let x, y;
  if(side === 0){ x = -20; y = randRange(0,H); }
  else if(side === 1){ x = W+20; y = randRange(0,H); }
  else if(side === 2){ x = randRange(0,W); y = -20; }
  else { x = randRange(0,W); y = H+20; }

  enemies.push({
    x,
    y,
    r: 14,
    speed: randRange(1.4,2.0),
    hp: 30 + time*0.5,
    maxHp: 30 + time*0.5,
    damage: 10
  });
}

function spawnXp(x,y,amount){
  for(let i=0;i<amount;i++){
    xpOrbs.push({
      x: x + randRange(-6,6),
      y: y + randRange(-6,6),
      r: 4,
      value: 4,
      vx: randRange(-0.5,0.5),
      vy: randRange(-0.5,0.5)
    });
  }
}

function update(dt){
  if(paused) return;

  time += dt;
  spawnTimer += dt;
  // spawn faster over time
  const interval = Math.max(0.35, 1.2 - time*0.01);
  if(spawnTimer >= interval){
    spawnTimer = 0;
    spawnEnemy();
  }

  // player movement
  let mx = 0, my = 0;
  if(keys['w'] || keys['arrowup']) my -= 1;
  if(keys['s'] || keys['arrowdown']) my += 1;
  if(keys['a'] || keys['arrowleft']) mx -= 1;
  if(keys['d'] || keys['arrowright']) mx += 1;
  const mag = Math.hypot(mx,my);
  if(mag>0){
    mx /= mag; my /= mag;
    player.x += mx * player.speed;
    player.y += my * player.speed;
  }
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  // enemies chase player
  enemies.forEach(e=>{
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.hypot(dx,dy) || 1;
    const vx = dx / d * e.speed;
    const vy = dy / d * e.speed;
    e.x += vx;
    e.y += vy;

    // touch player
    if(d < player.r + e.r){
      player.hp -= e.damage * dt * 0.5; // damage over time when overlapping
    }
  });
  if(player.hp < 0) player.hp = 0;

  // spinning blades damage
  const blades = [];
  for(let i=0;i<player.spinBlades;i++){
    const angle = time*2 + i * (Math.PI*2/player.spinBlades);
    blades.push({
      x: player.x + Math.cos(angle)*player.spinRadius,
      y: player.y + Math.sin(angle)*player.spinRadius,
      r: 10
    });
  }

  enemies.forEach(e=>{
    blades.forEach(b=>{
      const d = Math.hypot(e.x-b.x,e.y-b.y);
      if(d < e.r + b.r){
        e.hp -= player.spinDamage * dt * 4; // continuous damage
      }
    });
  });

  // xp orbs
  xpOrbs.forEach(o=>{
    // little drift
    o.x += o.vx;
    o.y += o.vy;
    o.vx *= 0.96;
    o.vy *= 0.96;

    const dx = player.x - o.x;
    const dy = player.y - o.y;
    const d = Math.hypot(dx,dy) || 1;

    // if close, pull towards player strongly
    if(d < 120){
      const pull = (120 - d)/120 * 0.6;
      o.x += dx/d * pull * 7;
      o.y += dy/d * pull * 7;
    }

    if(d < player.r + o.r + 2){
      player.xp += o.value;
      o.collected = true;
    }
  });
  xpOrbs = xpOrbs.filter(o=>!o.collected);

  // enemy death
  enemies = enemies.filter(e=>{
    if(e.hp <= 0){
      spawnXp(e.x,e.y,3);
      killed++;
      return false;
    }
    return true;
  });

  // level up
  while(player.xp >= player.xpToNext){
    player.xp -= player.xpToNext;
    player.level++;
    player.xpToNext = Math.floor(player.xpToNext * 1.4);
    showLevelUp();
  }

  // update UI
  hpFill.style.width = (player.hp/player.maxHp*100) + '%';
  xpFill.style.width = (player.xp/player.xpToNext*100) + '%';
  lvlText.textContent = player.level;
  timeText.textContent = time.toFixed(1);
  killsText.textContent = killed;

  // game over (simple)
  if(player.hp <= 0){
    paused = true;
    document.getElementById('message').textContent = 'You died! Refresh to restart.';
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // background grid
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const grid = 40;
  for(let x=0;x<=W;x+=grid){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=0;y<=H;y+=grid){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  ctx.restore();

  // xp orbs
  xpOrbs.forEach(o=>{
    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fillStyle = '#ffc83d';
    ctx.fill();
  });

  // enemies
  enemies.forEach(e=>{
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle = '#ff3d7d';
    ctx.fill();
    // hp bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2,3);
    ctx.fillStyle = '#ff8080';
    ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2*(e.hp/e.maxHp),3);
  });

  // spinning blades
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  for(let i=0;i<player.spinBlades;i++){
    const angle = time*2 + i*(Math.PI*2/player.spinBlades);
    const bx = player.x + Math.cos(angle)*player.spinRadius;
    const by = player.y + Math.sin(angle)*player.spinRadius;
    ctx.beginPath();
    ctx.arc(bx,by,10,0,Math.PI*2);
    ctx.stroke();
  }

  // player
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle = '#00ffcc';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
}

function loop(now){
  const dt = (now - lastFrame)/1000;
  lastFrame = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* level up panel */

function showLevelUp(){
  paused = true;
  levelPanel.classList.add('show');
  choicesEl.innerHTML = '';

  const options = [
    {
      title:'+20% Damage',
      desc:'Your spinning blades deal more damage.',
      apply:()=>{player.spinDamage *= 1.2;}
    },
    {
      title:'+20% Speed',
      desc:'Move faster to dodge monsters.',
      apply:()=>{player.speed *= 1.2;}
    },
    {
      title:'+1 Blade',
      desc:'Gain an extra spinning blade.',
      apply:()=>{player.spinBlades += 1;}
    },
    {
      title:'+20% HP',
      desc:'Increase max HP and heal a bit.',
      apply:()=>{
        player.maxHp = Math.round(player.maxHp*1.2);
        player.hp = Math.min(player.maxHp, player.hp + 20);
      }
    }
  ];

  // pick 3 random distinct choices
  const shuffled = options.sort(()=>Math.random()-0.5).slice(0,3);

  shuffled.forEach(opt=>{
    const div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = `<div class="choice-title">${opt.title}</div>
                     <div class="choice-desc">${opt.desc}</div>`;
    div.onclick = () => {
      opt.apply();
      levelPanel.classList.remove('show');
      paused = false;
    };
    choicesEl.appendChild(div);
  });
}

/* init home stats */
document.getElementById('home-par')?.remove(); // ignore leftover elements if any
</script>
</body>
</html>
