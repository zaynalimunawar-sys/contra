<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ninja Slice</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;touch-action:none;font-family:'Fredoka One',cursive;user-select:none;}
#canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;display:block;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;}
#hud{position:absolute;top:0;left:0;right:0;display:none;justify-content:space-between;padding:14px 18px;pointer-events:none;align-items:flex-start;}
.pill{background:rgba(0,0,0,.72);border:2px solid rgba(255,255,255,.18);border-radius:30px;padding:8px 20px;text-align:center;backdrop-filter:blur(6px);}
.plabel{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase;}
.pval{font-size:26px;color:#fff;line-height:1.1;}
#livesP .pval{font-size:17px;letter-spacing:4px;}
#comboP .pval{color:#ffcc00;}
#timeP{display:none;}
#timeP .pval{color:#00ffcc;}
#timerWrap{position:absolute;bottom:0;left:0;right:0;height:10px;background:rgba(255,255,255,.1);display:none;z-index:20;}
#timerFill{height:100%;width:100%;background:linear-gradient(90deg,#ff2200,#ffcc00,#00ff88);transition:width .1s linear;border-radius:0 5px 5px 0;}
#modeBanner{position:absolute;top:92px;left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.45);letter-spacing:3px;text-transform:uppercase;pointer-events:none;text-align:center;white-space:nowrap;}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;z-index:20;}
.screen.active{display:flex;}

/* ══════════════════════════════
   HOME SCREEN
══════════════════════════════ */
#sHome{
  background:radial-gradient(ellipse at 50% 0%,#3a0080 0%,#1a0040 40%,#000 100%);
  overflow:hidden;
}
/* Animated star particles behind everything */
#stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle linear infinite;}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1);}50%{opacity:.9;transform:scale(1.4);}}

.home-inner{display:flex;flex-direction:column;align-items:center;z-index:2;width:100%;padding:0 16px;}

/* Logo area */
.home-logo-wrap{position:relative;margin-bottom:6px;}
.logo-sword-l{font-size:clamp(28px,6vw,52px);position:absolute;left:-clamp(36px,8vw,68px);top:50%;transform:translateY(-50%) rotate(-30deg);filter:drop-shadow(0 0 12px #ff8800);animation:swordL 3s ease-in-out infinite;}
.logo-sword-r{font-size:clamp(28px,6vw,52px);position:absolute;right:-clamp(36px,8vw,68px);top:50%;transform:translateY(-50%) rotate(30deg);filter:drop-shadow(0 0 12px #ff8800);animation:swordR 3s ease-in-out infinite;}
@keyframes swordL{0%,100%{transform:translateY(-50%) rotate(-30deg);}50%{transform:translateY(-50%) rotate(-20deg);}}
@keyframes swordR{0%,100%{transform:translateY(-50%) rotate(30deg);}50%{transform:translateY(-50%) rotate(20deg);}}
.logo-main{font-family:'Bangers',cursive;font-size:clamp(72px,18vw,140px);letter-spacing:6px;line-height:.85;background:linear-gradient(180deg,#fff 0%,#ffdd00 30%,#ff6600 60%,#cc2200 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 40px rgba(255,100,0,.9));animation:logoGlow 2.5s ease-in-out infinite;text-align:center;}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 28px rgba(255,100,0,.8));}50%{filter:drop-shadow(0 0 70px rgba(255,220,0,1));}}
.logo-sub{font-family:'Bangers',cursive;font-size:clamp(13px,3vw,20px);color:#ff8800;letter-spacing:10px;text-shadow:0 0 20px #ff4400;margin-top:4px;margin-bottom:2px;}

/* Coins display */
.coins-bar{display:flex;align-items:center;gap:8px;background:rgba(255,200,0,.12);border:2px solid rgba(255,200,0,.3);border-radius:30px;padding:7px 20px;margin:10px 0 18px;font-size:20px;}
.coins-bar span{color:#ffdd00;font-size:22px;text-shadow:0 0 12px #ffaa00;}

/* Floating fruits row */
.fruit-row{display:flex;gap:clamp(10px,3vw,22px);margin-bottom:22px;animation:fruitFloat 2s ease-in-out infinite;}
@keyframes fruitFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.fruit-row span{font-size:clamp(28px,7vw,52px);filter:drop-shadow(0 4px 12px rgba(255,150,0,.6));animation:fruitSpin 4s linear infinite;}
.fruit-row span:nth-child(2){animation-delay:.3s;}
.fruit-row span:nth-child(3){animation-delay:.6s;}
.fruit-row span:nth-child(4){animation-delay:.9s;}
.fruit-row span:nth-child(5){animation-delay:1.2s;}
@keyframes fruitSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

/* Mode cards */
.mode-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;width:100%;}
.mcard{display:flex;flex-direction:column;align-items:center;padding:14px 20px;border:none;border-radius:22px;cursor:pointer;flex:1;min-width:100px;max-width:140px;transition:transform .15s,box-shadow .2s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;}
.mcard::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.08);opacity:0;transition:opacity .2s;}
.mcard:hover::before{opacity:1;}
.mcard:hover{transform:scale(1.08) translateY(-5px);}
.mcard:active{transform:scale(.94);}
.mc1{background:linear-gradient(135deg,#e65c00,#f9d423);box-shadow:0 8px 28px rgba(230,90,0,.55);}
.mc2{background:linear-gradient(135deg,#1a78c2,#00d2ff);box-shadow:0 8px 28px rgba(0,150,255,.45);}
.mc3{background:linear-gradient(135deg,#6a0dad,#d63aff);box-shadow:0 8px 28px rgba(180,0,255,.45);}
.micon{font-size:34px;margin-bottom:6px;}
.mname{font-size:15px;color:#fff;font-weight:bold;letter-spacing:1px;}
.mdesc{font-size:10px;color:rgba(255,255,255,.75);margin-top:3px;text-align:center;}

/* Bottom row buttons */
.home-btns{display:flex;gap:12px;margin-top:4px;}
.hbtn{font-family:'Fredoka One',cursive;font-size:17px;padding:12px 26px;border:none;border-radius:40px;cursor:pointer;transition:transform .15s;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:8px;}
.hbtn:hover{transform:scale(1.07);}
.hbtn:active{transform:scale(.94);}
.hbtn-shop{background:linear-gradient(135deg,#ffaa00,#ff6600);color:#fff;box-shadow:0 6px 20px rgba(255,120,0,.5);}
.hbtn-best{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.2);}

/* ══════════════════════════════
   SHOP SCREEN
══════════════════════════════ */
#sShop{background:radial-gradient(ellipse at 50% 0%,#001a44 0%,#000a22 60%,#000 100%);overflow-y:auto;justify-content:flex-start;padding-top:20px;}
.shop-header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 18px;margin-bottom:16px;}
.shop-title{font-family:'Bangers',cursive;font-size:clamp(38px,9vw,68px);color:#fff;letter-spacing:4px;text-shadow:0 0 30px #00aaff;}
.shop-coins{display:flex;align-items:center;gap:8px;background:rgba(255,200,0,.15);border:2px solid rgba(255,200,0,.4);border-radius:30px;padding:8px 18px;font-size:20px;color:#ffdd00;}
.shop-back{font-family:'Fredoka One',cursive;font-size:17px;padding:10px 22px;border:none;border-radius:30px;background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.2);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.shop-back:active{transform:scale(.94);}

.trail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%;padding:0 16px 30px;}
.tcard{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s,border-color .15s;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;}
.tcard:active{transform:scale(.95);}
.tcard.owned{border-color:rgba(0,255,150,.4);background:rgba(0,255,150,.06);}
.tcard.equipped{border-color:#ffcc00;background:rgba(255,200,0,.1);box-shadow:0 0 20px rgba(255,200,0,.3);}
.tcard-preview{width:100%;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.tcard-name{font-size:14px;color:#fff;font-weight:bold;text-align:center;}
.tcard-price{font-size:13px;color:#ffdd00;}
.tcard-badge{position:absolute;top:8px;right:8px;font-size:11px;padding:3px 8px;border-radius:10px;font-weight:bold;}
.badge-owned{background:#00ff96;color:#000;}
.badge-equipped{background:#ffcc00;color:#000;}
.badge-free{background:#aaaaaa;color:#000;}

/* ══════════════════════════════
   GAME OVER
══════════════════════════════ */
#sOver{background:radial-gradient(ellipse at center,#1c0000 0%,#060000 100%);}
.go-title{font-family:'Bangers',cursive;font-size:clamp(54px,13vw,106px);color:#ff1a00;text-shadow:0 0 50px #ff0000,0 0 100px #aa0000;letter-spacing:4px;animation:shake .09s infinite alternate;}
@keyframes shake{0%{transform:translateX(-2px);}100%{transform:translateX(2px);}}
.score-card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);border-radius:24px;padding:20px 40px;text-align:center;margin-bottom:28px;backdrop-filter:blur(10px);}
.sc-label{font-size:13px;color:rgba(255,255,255,.45);letter-spacing:3px;text-transform:uppercase;}
.sc-num{font-family:'Bangers',cursive;font-size:clamp(60px,14vw,110px);color:#fff;line-height:1;text-shadow:0 0 40px rgba(255,200,0,.9);}
.sc-mode{font-size:14px;color:rgba(255,255,255,.4);letter-spacing:3px;margin-top:2px;}
.sc-best{font-size:16px;color:#ffcc00;margin-top:6px;}
.sc-coins{font-size:15px;color:#ffdd00;margin-top:4px;}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.gbtn{font-family:'Fredoka One',cursive;font-size:19px;padding:13px 30px;border:none;border-radius:40px;cursor:pointer;transition:transform .15s;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:8px;}
.gbtn:hover{transform:scale(1.07);}
.gbtn:active{transform:scale(.94);}
.gbp{background:linear-gradient(135deg,#ff6600,#ff2200);color:#fff;box-shadow:0 8px 26px rgba(255,60,0,.5);}
.gbs{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.2);}
.gbshare{background:linear-gradient(135deg,#1da1f2,#0d7abf);color:#fff;}
.gbcopy{background:linear-gradient(135deg,#25d366,#128c4e);color:#fff;}

#copyToast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 28px;border-radius:30px;font-size:16px;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;border:1px solid rgba(255,255,255,.2);}
#copyToast.show{opacity:1;}
#countdown{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;z-index:25;pointer-events:none;}
#countdown.active{display:flex;}
#cdNum{font-family:'Bangers',cursive;font-size:clamp(110px,24vw,210px);color:#fff;text-shadow:0 0 60px rgba(255,180,0,1);}
@keyframes cdPop{0%{transform:scale(2.2);opacity:0;}60%{transform:scale(1.05);opacity:1;}100%{transform:scale(1);opacity:1;}}
.popup{position:fixed;font-family:'Bangers',cursive;font-size:32px;color:#ffdd00;text-shadow:0 0 16px #ff8800,2px 2px 0 #000;pointer-events:none;z-index:40;animation:popUp .85s ease-out forwards;}
.popup.big{font-size:50px;color:#ff4400;}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(.85);}40%{opacity:1;transform:translateY(-55px) scale(1.15);}100%{opacity:0;transform:translateY(-95px) scale(.9);}}
@keyframes timePulse{0%,100%{color:#ff2200;}50%{color:#ffaa00;}}
.time-low{animation:timePulse .4s ease-in-out infinite !important;}
#bombFlash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,#ff4400 40%,transparent 70%);z-index:998;pointer-events:none;opacity:0;transition:opacity .05s;}
#bombFlash.boom{opacity:1;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="bombFlash"></div>
<div id="ui">
  <div id="hud">
    <div class="pill"><div class="plabel">Score</div><div class="pval" id="scoreVal">0</div></div>
    <div class="pill" id="livesP"><div class="plabel">Lives</div><div class="pval" id="livesVal">❤️❤️❤️</div></div>
    <div class="pill" id="timeP"><div class="plabel">Time</div><div class="pval" id="timeVal">60</div></div>
    <div class="pill" id="comboP"><div class="plabel">Combo</div><div class="pval" id="comboVal">0x</div></div>
  </div>
  <div id="modeBanner"></div>
  <div id="timerWrap"><div id="timerFill"></div></div>
  <div id="countdown"><span id="cdNum">3</span></div>

  <!-- ══ HOME ══ -->
  <div class="screen active" id="sHome">
    <div id="stars"></div>
    <div class="home-inner">
      <div class="home-logo-wrap">
        <span class="logo-sword-l">⚔️</span>
        <div class="logo-main">NINJA<br>SLICE</div>
        <span class="logo-sword-r">⚔️</span>
      </div>
      <div class="logo-sub">⚡ SLICE EVERYTHING ⚡</div>
      <div class="coins-bar">🪙 <span id="homeCoins">0</span> coins</div>
      <div class="fruit-row">
        <span>🍎</span><span>🍊</span><span>🍉</span><span>🍓</span><span>🥝</span>
      </div>
      <div class="mode-row">
        <button class="mcard mc1" id="btnClassic">
          <span class="micon">⚔️</span>
          <span class="mname">CLASSIC</span>
          <span class="mdesc">3 lives · slice all</span>
        </button>
        <button class="mcard mc2" id="btnZen">
          <span class="micon">🧘</span>
          <span class="mname">ZEN</span>
          <span class="mdesc">60s · no bombs</span>
        </button>
        <button class="mcard mc3" id="btnArcade">
          <span class="micon">⚡</span>
          <span class="mname">ARCADE</span>
          <span class="mdesc">🍌=+5s · 💣=-10s</span>
        </button>
      </div>
      <div class="home-btns">
        <button class="hbtn hbtn-shop" id="btnShop">🛒 SHOP</button>
        <button class="hbtn hbtn-best" id="btnBest">🏆 BEST: <span id="bestVal">0</span></button>
      </div>
    </div>
  </div>

  <!-- ══ SHOP ══ -->
  <div class="screen" id="sShop">
    <div class="shop-header">
      <div class="shop-title">🛒 SHOP</div>
      <div class="shop-coins">🪙 <span id="shopCoins">0</span></div>
      <button class="shop-back" id="btnShopBack">✕ BACK</button>
    </div>
    <div class="trail-grid" id="trailGrid"></div>
  </div>

  <!-- ══ GAME OVER ══ -->
  <div class="screen" id="sOver">
    <div class="go-title">GAME OVER</div>
    <div class="score-card">
      <div class="sc-label">Your Score</div>
      <div class="sc-num" id="goScore">0</div>
      <div class="sc-mode" id="goMode">CLASSIC MODE</div>
      <div class="sc-best" id="goBest">Best: 0</div>
      <div class="sc-coins" id="goCoins">+0 🪙 earned</div>
    </div>
    <div class="btn-row">
      <button class="gbtn gbp"     id="btnRetry">↩ RETRY</button>
      <button class="gbtn gbcopy"  id="btnCopy">📋 COPY</button>
      <button class="gbtn gbshare" id="btnShare">🔗 SHARE</button>
      <button class="gbtn gbs"     id="btnHome">🏠 HOME</button>
    </div>
  </div>
</div>
<div id="copyToast">✅ Copied!</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

// ══════════════════════════════
//  PERSISTENCE
// ══════════════════════════════
let bests={classic:0,zen:0,arcade:0};
let coins=0;
let ownedTrails=[];
let equippedTrail='classic';

function loadSave(){
  try{
    const s=JSON.parse(localStorage.getItem('ns_save')||'{}');
    bests=s.bests||{classic:0,zen:0,arcade:0};
    coins=s.coins||0;
    ownedTrails=s.ownedTrails||[];
    equippedTrail=s.equippedTrail||'classic';
  }catch(e){}
  // Classic always owned
  if(!ownedTrails.includes('classic')) ownedTrails.push('classic');
}
function save(){
  try{ localStorage.setItem('ns_save',JSON.stringify({bests,coins,ownedTrails,equippedTrail})); }catch(e){}
}
loadSave();

function topBest(){return Math.max(bests.classic,bests.zen,bests.arcade);}
function updateCoinUI(){
  document.getElementById('homeCoins').textContent=coins;
  document.getElementById('shopCoins').textContent=coins;
}

// ══════════════════════════════
//  TRAIL DEFINITIONS
// ══════════════════════════════
const TRAILS=[
  {id:'classic', name:'Classic',    price:0,    colors:['rgba(255,255,255,{a})'],            desc:'Clean white blade'},
  {id:'fire',    name:'Fire',       price:80,   colors:['rgba(255,60,0,{a})','rgba(255,180,0,{a})'],  desc:'Blazing hot trail'},
  {id:'ice',     name:'Ice',        price:80,   colors:['rgba(100,220,255,{a})','rgba(200,240,255,{a})'], desc:'Frosty cool blade'},
  {id:'toxic',   name:'Toxic',      price:100,  colors:['rgba(0,255,80,{a})','rgba(180,255,0,{a})'],   desc:'Radioactive green'},
  {id:'galaxy',  name:'Galaxy',     price:150,  colors:['rgba(180,0,255,{a})','rgba(0,150,255,{a})','rgba(255,0,180,{a})'], desc:'Cosmic rainbow'},
  {id:'gold',    name:'Gold',       price:200,  colors:['rgba(255,215,0,{a})','rgba(255,160,0,{a})'],  desc:'Pure golden trail'},
  {id:'blood',   name:'Blood',      price:120,  colors:['rgba(200,0,0,{a})','rgba(255,50,50,{a})'],    desc:'Dark red slice'},
  {id:'electric',name:'Electric',   price:180,  colors:['rgba(0,200,255,{a})','rgba(255,255,100,{a})'],'desc':'Zap zap!'},
  {id:'rainbow', name:'Rainbow',    price:250,  colors:['rgba(255,0,0,{a})','rgba(255,165,0,{a})','rgba(0,255,0,{a})','rgba(0,0,255,{a})','rgba(238,130,238,{a})'], desc:'All the colors'},
  {id:'ghost',   name:'Ghost',      price:90,   colors:['rgba(200,200,255,{a})'],              desc:'Pale phantom trail'},
  {id:'lava',    name:'Lava',       price:160,  colors:['rgba(255,80,0,{a})','rgba(255,220,0,{a})','rgba(180,0,0,{a})'], desc:'Molten hot'},
  {id:'candy',   name:'Candy',      price:130,  colors:['rgba(255,100,200,{a})','rgba(100,200,255,{a})'], desc:'Sweet & colorful'},
];

// Trail preview gradient colors for cards
const TRAIL_BG={
  classic:'linear-gradient(90deg,#555,#fff)',
  fire:'linear-gradient(90deg,#ff2200,#ffaa00)',
  ice:'linear-gradient(90deg,#00aaff,#ccf5ff)',
  toxic:'linear-gradient(90deg,#00cc44,#aaff00)',
  galaxy:'linear-gradient(90deg,#8800ff,#0088ff,#ff00cc)',
  gold:'linear-gradient(90deg,#aa7700,#ffdd00)',
  blood:'linear-gradient(90deg,#660000,#ff3333)',
  electric:'linear-gradient(90deg,#0088ff,#ffff44)',
  rainbow:'linear-gradient(90deg,#f00,#ff8800,#0f0,#00f,#ee82ee)',
  ghost:'linear-gradient(90deg,#aaaacc,#ddddf8)',
  lava:'linear-gradient(90deg,#ff3300,#ffcc00,#880000)',
  candy:'linear-gradient(90deg,#ff66cc,#66ccff)',
};

function buildShop(){
  const grid=document.getElementById('trailGrid');
  grid.innerHTML='';
  TRAILS.forEach(tr=>{
    const owned=ownedTrails.includes(tr.id);
    const equipped=equippedTrail===tr.id;
    const card=document.createElement('div');
    card.className='tcard'+(owned?' owned':'')+(equipped?' equipped':'');
    card.innerHTML=`
      <div class="tcard-preview" style="background:${TRAIL_BG[tr.id]}"></div>
      <div class="tcard-name">${tr.name}</div>
      <div class="tcard-price">${tr.price===0?'FREE':'🪙 '+tr.price}</div>
      ${equipped?'<div class="tcard-badge badge-equipped">EQUIPPED</div>':owned?'<div class="tcard-badge badge-owned">OWNED</div>':tr.price===0?'<div class="tcard-badge badge-free">FREE</div>':''}
    `;
    card.addEventListener('click',()=>onTrailClick(tr));
    grid.appendChild(card);
  });
}

function onTrailClick(tr){
  const owned=ownedTrails.includes(tr.id);
  if(owned){
    equippedTrail=tr.id; save(); buildShop(); sndBeep(false);
  } else {
    if(coins>=tr.price){
      coins-=tr.price;
      ownedTrails.push(tr.id);
      equippedTrail=tr.id;
      save(); updateCoinUI(); buildShop(); sndCombo(3);
      showToast('✅ '+tr.name+' trail unlocked!');
    } else {
      showToast('❌ Not enough coins!');
    }
  }
}

// ══════════════════════════════
//  STARS on home screen
// ══════════════════════════════
function buildStars(){
  const c=document.getElementById('stars'); c.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=1+Math.random()*2.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${1.5+Math.random()*3}s;animation-delay:${Math.random()*3}s;`;
    c.appendChild(s);
  }
}

let AC=null;
function getAC(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function sndSlice(){
  try{
    const ac=getAC();
    const buf=ac.createBuffer(1,ac.sampleRate*0.12,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=ac.createBufferSource(); src.buffer=buf;
    const filt=ac.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=2200; filt.Q.value=0.8;
    const gain=ac.createGain();
    gain.gain.setValueAtTime(0.45,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.12);
    src.connect(filt);filt.connect(gain);gain.connect(ac.destination);
    src.start();src.stop(ac.currentTime+0.13);
  }catch(e){}
}
function sndSplat(){
  try{
    const ac=getAC();
    const osc=ac.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(180,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40,ac.currentTime+0.08);
    const g1=ac.createGain();
    g1.gain.setValueAtTime(0.6,ac.currentTime);
    g1.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.09);
    osc.connect(g1);g1.connect(ac.destination); osc.start();osc.stop(ac.currentTime+0.1);
    const buf=ac.createBuffer(1,ac.sampleRate*0.04,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.3));
    const src=ac.createBufferSource();src.buffer=buf;
    const g2=ac.createGain(); g2.gain.setValueAtTime(0.35,ac.currentTime);
    src.connect(g2);g2.connect(ac.destination); src.start();src.stop(ac.currentTime+0.05);
  }catch(e){}
}
function sndCombo(count){
  try{
    const ac=getAC();
    const freqs=[523,659,784,1047,1319];
    const f=freqs[Math.min(count-2,freqs.length-1)];
    const osc=ac.createOscillator(); osc.type='triangle';
    osc.frequency.setValueAtTime(f,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f*1.4,ac.currentTime+0.15);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.4,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.25);
    osc.connect(g);g.connect(ac.destination); osc.start();osc.stop(ac.currentTime+0.26);
  }catch(e){}
}
function sndBoom(){
  try{
    const ac=getAC();
    const sub=ac.createOscillator(); sub.type='sine';
    sub.frequency.setValueAtTime(80,ac.currentTime);
    sub.frequency.exponentialRampToValueAtTime(20,ac.currentTime+0.4);
    const gSub=ac.createGain();
    gSub.gain.setValueAtTime(1.2,ac.currentTime);
    gSub.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.45);
    sub.connect(gSub);gSub.connect(ac.destination); sub.start();sub.stop(ac.currentTime+0.46);
    const mid=ac.createOscillator(); mid.type='sawtooth';
    mid.frequency.setValueAtTime(120,ac.currentTime);
    mid.frequency.exponentialRampToValueAtTime(30,ac.currentTime+0.25);
    const gMid=ac.createGain();
    gMid.gain.setValueAtTime(0.5,ac.currentTime);
    gMid.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.28);
    mid.connect(gMid);gMid.connect(ac.destination); mid.start();mid.stop(ac.currentTime+0.3);
    const bufLen=ac.sampleRate*0.55;
    const buf=ac.createBuffer(1,bufLen,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/bufLen,1.5);
    const noise=ac.createBufferSource(); noise.buffer=buf;
    const filt=ac.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=800;
    const gNoise=ac.createGain();
    gNoise.gain.setValueAtTime(1.0,ac.currentTime);
    gNoise.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.55);
    noise.connect(filt);filt.connect(gNoise);gNoise.connect(ac.destination); noise.start();noise.stop(ac.currentTime+0.56);
    const crk=ac.createBuffer(1,ac.sampleRate*0.15,ac.sampleRate);
    const cd=crk.getChannelData(0);
    for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*Math.exp(-i/(cd.length*0.2));
    const crkSrc=ac.createBufferSource(); crkSrc.buffer=crk;
    const gCrk=ac.createGain();
    gCrk.gain.setValueAtTime(0.55,ac.currentTime);
    gCrk.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);
    crkSrc.connect(gCrk);gCrk.connect(ac.destination); crkSrc.start();crkSrc.stop(ac.currentTime+0.16);
  }catch(e){}
}
function sndMiss(){
  try{
    const ac=getAC();
    const osc=ac.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(110,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(55,ac.currentTime+0.18);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.5,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);
    osc.connect(g);g.connect(ac.destination); osc.start();osc.stop(ac.currentTime+0.21);
  }catch(e){}
}
function sndBeep(final){
  try{
    const ac=getAC();
    const osc=ac.createOscillator(); osc.type='sine';
    osc.frequency.value=final?880:440;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.3,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+(final?0.4:0.15));
    osc.connect(g);g.connect(ac.destination);
    osc.start();osc.stop(ac.currentTime+(final?0.41:0.16));
  }catch(e){}
}

// ══════════════════════════════
//  GAME STATE
// ══════════════════════════════
let mode='classic',score=0,lives=3,combo=0,playing=false,timeLeft=60;
let fruits=[],halves=[],parts=[],rings=[],blade=[];
let spawnTO=null,tickIV=null,comboTO=null;
let lastPX=0,lastPY=0,pDown=false;
let coinsEarned=0; // coins earned this round

const FDATA=[
  {e:'🍎',flesh:'#ffcccc',juice:'#ff3333'},
  {e:'🍊',flesh:'#ffe0aa',juice:'#ff8800'},
  {e:'🍌',flesh:'#fffff0',juice:'#ffe135'},
  {e:'🍇',flesh:'#ddaaff',juice:'#9900cc'},
  {e:'🍉',flesh:'#ff9999',juice:'#cc0033'},
  {e:'🍓',flesh:'#ffaaaa',juice:'#cc0022'},
  {e:'🥝',flesh:'#ccff88',juice:'#55aa00'},
  {e:'🍍',flesh:'#fff5aa',juice:'#e8c000'},
  {e:'🍒',flesh:'#ffbbbb',juice:'#990000'},
  {e:'🍑',flesh:'#ffe0cc',juice:'#ff7050'},
  {e:'🥭',flesh:'#ffeeaa',juice:'#ff9900'},
  {e:'🍋',flesh:'#fffff0',juice:'#ffee00'},
];
const HEARTS=['💀','❤️','❤️❤️','❤️❤️❤️'];

// Particle pool
const POOL_SIZE=300;
const pool=[];
for(let i=0;i<POOL_SIZE;i++)pool.push({alive:false});
function getP(){for(let i=0;i<POOL_SIZE;i++){if(!pool[i].alive)return pool[i];}return null;}
function burstJuice(x,y,col,n){
  for(let i=0;i<n;i++){
    const p=getP();if(!p)continue;
    const a=Math.random()*Math.PI*2,s=2+Math.random()*8;
    p.alive=true;p.x=x;p.y=y;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s-4;
    p.g=0.3;p.sz=2+Math.random()*4;p.col=col;p.alpha=1;p.dec=0.025+Math.random()*0.02;
  }
}

function makeFruit(){
  const isBomb=(mode!=='zen')&&Math.random()<0.1;
  const isBonus=(mode==='arcade')&&!isBomb&&Math.random()<0.09;
  const fd=FDATA[Math.floor(Math.random()*FDATA.length)];
  const lane=Math.floor(Math.random()*3);
  let sx,svx;
  if(lane===0){sx=W*0.15;svx=4+Math.random()*4;}
  else if(lane===2){sx=W*0.85;svx=-(4+Math.random()*4);}
  else{sx=W*0.25+Math.random()*W*0.5;svx=(Math.random()-.5)*6;}
  return{x:sx,y:H+60,vx:svx,vy:-(H*0.024+Math.random()*H*0.009),g:0.4,
    size:60+Math.random()*28,isBomb,isBonus,
    emoji:isBonus?'🍌':(isBomb?'💣':fd.e),
    flesh:fd.flesh,juice:isBomb?'#ff3300':fd.juice,
    sliced:false,rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*0.09};
}

function doSpawn(){
  fruits.push(makeFruit());
  if(score>150&&Math.random()<0.35)fruits.push(makeFruit());
  if(!playing)return;
  const base=mode==='arcade'?480:mode==='zen'?820:700;
  const delay=Math.max(200,base-Math.min(score/50,340)+Math.random()*300);
  spawnTO=setTimeout(doSpawn,delay);
}

function sliceIntoHalves(f,angle){
  const px=Math.sin(angle),py=-Math.cos(angle),sp=3+Math.random()*3;
  for(let s=0;s<2;s++){
    const d=s===0?-1:1;
    halves.push({x:f.x,y:f.y,vx:f.vx+px*d*sp,vy:f.vy*0.55+py*d*sp-1,
      g:0.42,size:f.size,emoji:f.emoji,flesh:f.flesh,juice:f.juice,
      side:s,rot:f.rot,rotV:(Math.random()-.5)*0.2*d,alpha:1});
  }
  burstJuice(f.x,f.y,f.juice,24);
}

function drawHalf(h){
  const r=h.size*0.52;
  ctx.save();
  ctx.beginPath();
  if(h.side===0){ctx.arc(0,0,r,Math.PI*.5,Math.PI*1.5);ctx.closePath();}
  else{ctx.arc(0,0,r,-Math.PI*.5,Math.PI*.5);ctx.closePath();}
  ctx.clip();
  ctx.font=h.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(h.emoji,0,0);
  ctx.fillStyle=h.flesh;ctx.globalAlpha=0.45;
  ctx.fillRect(h.side===0?-r:0,-r,r,r*2);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();
  ctx.restore();
}

function bombExplosion(x,y){
  sndBoom();
  burstJuice(x,y,'#ff4400',40);burstJuice(x,y,'#ffaa00',30);burstJuice(x,y,'#ffffff',15);
  for(let i=0;i<3;i++){
    rings.push({x,y,r:10,alpha:0.9,col:i===0?'#fff':i===1?'#ff8800':'#ff2200',delay:i*6});
  }
  const fl=document.getElementById('bombFlash');
  fl.classList.add('boom');
  setTimeout(()=>fl.classList.remove('boom'),80);
  let t=0;
  const shake=setInterval(()=>{
    t++;canvas.style.transform=`translate(${(Math.random()-.5)*12}px,${(Math.random()-.5)*12}px)`;
    if(t>8){clearInterval(shake);canvas.style.transform='none';}
  },30);
}

// ══════════════════════════════
//  TRAIL DRAWING
// ══════════════════════════════
function getTrailColors(){
  const tr=TRAILS.find(t=>t.id===equippedTrail)||TRAILS[0];
  return tr.colors;
}
function trailColor(colors,t){
  // t = 0..1 (tail to tip)
  const idx=Math.floor(t*(colors.length-1));
  const col=colors[Math.min(idx,colors.length-1)];
  return col.replace('{a}',t*0.92);
}

function drawBlade(){
  if(blade.length<2)return;
  const colors=getTrailColors();
  ctx.save();ctx.shadowBlur=0;
  for(let i=1;i<blade.length;i++){
    const t=i/blade.length;
    ctx.strokeStyle=trailColor(colors,t);
    ctx.lineWidth=12*t;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(blade[i-1].x,blade[i-1].y);ctx.lineTo(blade[i].x,blade[i].y);ctx.stroke();
  }
  const tip=blade[blade.length-1];
  ctx.shadowColor=trailColor(colors,1).replace('{a}','1');
  ctx.shadowBlur=28;
  ctx.fillStyle='rgba(255,255,255,.95)';
  ctx.beginPath();ctx.arc(tip.x,tip.y,5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function refreshHUD(){
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('livesVal').textContent=HEARTS[Math.max(0,Math.min(3,lives))];
  const cv=document.getElementById('comboVal');
  cv.textContent=combo+'x';cv.style.opacity=combo>=2?'1':'0.4';
  if(mode!=='classic'){
    const tv=document.getElementById('timeVal');
    tv.textContent=Math.ceil(timeLeft);
    if(timeLeft<=10)tv.classList.add('time-low');else tv.classList.remove('time-low');
    document.getElementById('timerFill').style.width=Math.max(0,(timeLeft/60)*100)+'%';
  }
}
function showHUD(v){document.getElementById('hud').style.display=v?'flex':'none';}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  if(id)document.getElementById(id).classList.add('active');
}
function flashRed(){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(255,0,0,.2);z-index:997;pointer-events:none;transition:opacity .25s;';
  document.body.appendChild(d);setTimeout(()=>d.style.opacity='0',80);setTimeout(()=>d.remove(),350);
}
function popup(x,y,txt,big){
  const d=document.createElement('div');d.className='popup'+(big?' big':'');
  d.textContent=txt;d.style.left=(x-40)+'px';d.style.top=(y-60)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),900);
}

function trySlice(x,y){
  const angle=Math.atan2(y-lastPY,x-lastPX);
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    if(f.sliced)continue;
    if(Math.hypot(x-f.x,y-f.y)<f.size*0.65){
      f.sliced=true;
      if(f.isBomb){
        bombExplosion(f.x,f.y);
        fruits.splice(i,1);
        if(mode==='classic'){setTimeout(()=>endGame(),300);return;}
        if(mode==='arcade'){
          timeLeft=Math.max(0,timeLeft-10);
          popup(f.x,f.y,'💣 -10s!',true);refreshHUD();
          if(timeLeft<=0){setTimeout(()=>endGame(),300);return;}
        }
        continue;
      }
      sndSlice();
      setTimeout(()=>sndSplat(),40);
      sliceIntoHalves(f,angle);
      fruits.splice(i,1);
      clearTimeout(comboTO);combo++;
      comboTO=setTimeout(()=>{combo=0;refreshHUD();},1500);
      const pts=10*Math.max(1,combo);score+=pts;
      // Earn 1 coin per fruit sliced
      coinsEarned++;
      if(combo>=2)sndCombo(combo);
      if(f.isBonus&&mode==='arcade'){
        timeLeft=Math.min(60,timeLeft+5);popup(f.x,f.y,'🍌 +5s!',true);
      } else {
        popup(f.x,f.y,'+'+pts,combo>=3);
        if(combo>=3)popup(f.x,f.y-70,combo+'x COMBO!',true);
      }
      refreshHUD();
    }
  }
}

let bgCanvas=null;
function buildBG(){
  bgCanvas=document.createElement('canvas');bgCanvas.width=W;bgCanvas.height=H;
  const bc=bgCanvas.getContext('2d');
  const g=bc.createLinearGradient(0,0,0,H);
  if(mode==='zen'){g.addColorStop(0,'#001a33');g.addColorStop(1,'#002244');}
  else if(mode==='arcade'){g.addColorStop(0,'#1a0030');g.addColorStop(1,'#2d0050');}
  else{g.addColorStop(0,'#0d0020');g.addColorStop(.6,'#1a003a');g.addColorStop(1,'#060010');}
  bc.fillStyle=g;bc.fillRect(0,0,W,H);
  const orb=bc.createRadialGradient(W*.5,H*.35,0,W*.5,H*.35,W*.5);
  orb.addColorStop(0,mode==='arcade'?'rgba(130,0,220,.1)':mode==='zen'?'rgba(0,80,180,.08)':'rgba(90,0,180,.09)');
  orb.addColorStop(1,'transparent');
  bc.fillStyle=orb;bc.fillRect(0,0,W,H);
}

function render(){
  requestAnimationFrame(render);
  if(!bgCanvas)buildBG();
  ctx.drawImage(bgCanvas,0,0);
  if(!playing){drawBlade();return;}
  ctx.shadowBlur=0;
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    f.vy+=f.g;f.x+=f.vx;f.y+=f.vy;f.rot+=f.rotV;
    if(f.y>H+160&&!f.sliced){
      fruits.splice(i,1);
      if(!f.isBomb&&mode==='classic'){sndMiss();lives--;flashRed();refreshHUD();if(lives<=0){endGame();return;}}
      continue;
    }
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
    ctx.font=f.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.emoji,0,0);ctx.restore();
  }
  for(let i=halves.length-1;i>=0;i--){
    const h=halves[i];
    h.vy+=h.g;h.x+=h.vx;h.y+=h.vy;h.rot+=h.rotV;h.alpha-=0.022;
    if(h.alpha<=0||h.y>H+200){halves.splice(i,1);continue;}
    ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot);ctx.globalAlpha=h.alpha;
    drawHalf(h);ctx.restore();
  }
  for(let i=rings.length-1;i>=0;i--){
    const rg=rings[i];
    if(rg.delay>0){rg.delay--;continue;}
    rg.r+=14;rg.alpha-=0.045;
    if(rg.alpha<=0){rings.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=rg.alpha;ctx.strokeStyle=rg.col;
    ctx.lineWidth=4*rg.alpha;ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  for(let i=0;i<POOL_SIZE;i++){
    const p=pool[i];if(!p.alive)continue;
    p.vx*=0.96;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.alpha-=p.dec;
    if(p.alpha<=0){p.alive=false;continue;}
    ctx.globalAlpha=p.alpha;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawBlade();
}

function onMove(x,y){
  if(!pDown)return;
  blade.push({x,y});if(blade.length>18)blade.shift();
  if(playing)trySlice(x,y);
  lastPX=x;lastPY=y;
}
document.addEventListener('mousedown',e=>{if(e.target.tagName==='BUTTON')return;pDown=true;lastPX=e.clientX;lastPY=e.clientY;onMove(e.clientX,e.clientY);});
document.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
document.addEventListener('mouseup',()=>{pDown=false;blade=[];});
document.addEventListener('touchstart',e=>{if(e.target.tagName==='BUTTON')return;e.preventDefault();pDown=true;lastPX=e.touches[0].clientX;lastPY=e.touches[0].clientY;onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
document.addEventListener('touchend',()=>{pDown=false;blade=[];});

function runCountdown(cb){
  const wrap=document.getElementById('countdown'),num=document.getElementById('cdNum');
  let n=3;wrap.classList.add('active');
  function tick(){
    sndBeep(n===1);
    num.textContent=n;
    num.style.animation='none';void num.offsetWidth;num.style.animation='cdPop .8s ease-out';
    n--;if(n>0)setTimeout(tick,900);else setTimeout(()=>{sndBeep(true);wrap.classList.remove('active');cb();},900);
  }
  tick();
}

function startGame(m){
  getAC();
  mode=m;bgCanvas=null;
  score=0;lives=3;combo=0;timeLeft=60;coinsEarned=0;
  playing=false;
  fruits=[];halves=[];parts=[];rings=[];blade=[];
  for(let i=0;i<POOL_SIZE;i++)pool[i].alive=false;
  clearTimeout(spawnTO);clearInterval(tickIV);clearTimeout(comboTO);
  showScreen(null);showHUD(false);
  document.getElementById('modeBanner').textContent='';
  document.getElementById('timerWrap').style.display='none';
  document.getElementById('timeP').style.display='none';
  runCountdown(()=>{
    playing=true;showHUD(true);
    if(mode!=='classic'){
      document.getElementById('timeP').style.display='block';
      document.getElementById('timerWrap').style.display='block';
    }
    refreshHUD();
    const names={classic:'⚔️ CLASSIC',zen:'🧘 ZEN MODE',arcade:'⚡ ARCADE'};
    const b=document.getElementById('modeBanner');
    b.textContent=names[mode];setTimeout(()=>b.textContent='',3000);
    doSpawn();
    if(mode==='zen'||mode==='arcade'){
      clearInterval(tickIV);
      tickIV=setInterval(()=>{
        if(!playing)return;
        timeLeft=parseFloat((timeLeft-.1).toFixed(1));
        if(timeLeft<0)timeLeft=0;
        refreshHUD();
        if(timeLeft<=0){clearInterval(tickIV);endGame();}
      },100);
    }
  });
}

function endGame(){
  if(!playing)return;
  playing=false;
  clearTimeout(spawnTO);clearInterval(tickIV);
  showHUD(false);document.getElementById('timerWrap').style.display='none';
  const isNew=score>bests[mode];
  if(isNew){bests[mode]=score;}
  // Award coins
  coins+=coinsEarned;
  save();
  updateCoinUI();
  setTimeout(()=>{
    document.getElementById('goScore').textContent=score;
    document.getElementById('goMode').textContent=mode.toUpperCase()+' MODE';
    document.getElementById('goBest').textContent=isNew?'🏆 NEW BEST!':'Best: '+bests[mode];
    document.getElementById('goCoins').textContent='+'+coinsEarned+' 🪙 earned';
    document.getElementById('bestVal').textContent=topBest();
    showScreen('sOver');
  },500);
}

function goHome(){
  playing=false;clearTimeout(spawnTO);clearInterval(tickIV);
  fruits=[];halves=[];parts=[];rings=[];blade=[];
  for(let i=0;i<POOL_SIZE;i++)pool[i].alive=false;
  showHUD(false);document.getElementById('timerWrap').style.display='none';
  document.getElementById('bestVal').textContent=topBest();
  updateCoinUI();
  bgCanvas=null;showScreen('sHome');
}

function showToast(m){const t=document.getElementById('copyToast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function buildTxt(){return `🍉 Ninja Slice — ${mode.charAt(0).toUpperCase()+mode.slice(1)} Mode\n🏆 Score: ${score}\n⚔️ Can you beat me? #NinjaSlice`;}
function copyScore(){const txt=buildTxt();if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>showToast('✅ Copied!')).catch(()=>fbCopy(txt));else fbCopy(txt);}
function fbCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('✅ Copied!');}catch(e){showToast('❌ Failed');}ta.remove();}
function shareScore(){const t=buildTxt();if(navigator.share)navigator.share({title:'Ninja Slice',text:t}).catch(()=>copyScore());else window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t),'_blank');}

// Buttons
document.getElementById('btnClassic').addEventListener('click',()=>startGame('classic'));
document.getElementById('btnZen').addEventListener('click',()=>startGame('zen'));
document.getElementById('btnArcade').addEventListener('click',()=>startGame('arcade'));
document.getElementById('btnRetry').addEventListener('click',()=>startGame(mode));
document.getElementById('btnHome').addEventListener('click',()=>goHome());
document.getElementById('btnCopy').addEventListener('click',()=>copyScore());
document.getElementById('btnShare').addEventListener('click',()=>shareScore());
document.getElementById('btnShop').addEventListener('click',()=>{buildShop();showScreen('sShop');});
document.getElementById('btnShopBack').addEventListener('click',()=>showScreen('sHome'));

// Init
updateCoinUI();
document.getElementById('bestVal').textContent=topBest();
buildShop();
requestAnimationFrame(render);
</script>
</body>
</html>
